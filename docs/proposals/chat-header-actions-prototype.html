<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat header actions</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #1f2240; --bg3: #2a2e54; --bg-elev: #23264a;
  --fg: #e8e8f0; --fg2: #b4b4c4; --fg3: #8f90a8;
  --border: #2e3258; --border-strong: #3a3f70;
  --accent: #ff4d6d; --accent-strong: #ff2e54; --on-accent: #1a1a2e;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4fa; --bg2: #ffffff; --bg3: #e6e8f4; --bg-elev: #fcfcfd;
    --fg: #1a1a2e; --fg2: #5f607d; --fg3: #66687f; --border: #d2d4e3; --border-strong: #b6b8cf;
    --accent: #d81b60; --accent-strong: #b00d46; --on-accent: #fff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f4fa; --bg2: #ffffff; --bg3: #e6e8f4; --bg-elev: #fcfcfd;
  --fg: #1a1a2e; --fg2: #5f607d; --fg3: #66687f; --border: #d2d4e3; --border-strong: #b6b8cf;
  --accent: #d81b60; --accent-strong: #b00d46; --on-accent: #fff; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.proto-bar { position: fixed; left: 12px; bottom: 12px; width: 250px; z-index: 100; display: flex; flex-wrap: wrap; gap: 2px; padding: 6px;
  background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 12px; }
.proto-bar span { color: var(--fg3); font: 600 11px var(--mono); letter-spacing: .5px; text-transform: uppercase; padding: 6px 8px 0; flex-basis: 100%; }
.proto-bar button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--fg2); flex-basis: 100%; text-align: left; }
.proto-bar button[aria-pressed="true"] { background: var(--bg3); color: var(--fg); }

.app { display: flex; height: 100%; }
.sidebar { width: 260px; flex: none; background: var(--bg2); border-right: 1px solid var(--border); padding: 10px 12px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--mono); height: 36px; margin-bottom: 10px; }
.brand b { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 12px; }
.brand .grow { flex: 1; }
.brand .ic { color: var(--fg2); font: 400 14px var(--font); letter-spacing: 6px; }
.sk { height: 34px; border-radius: 8px; background: var(--bg3); opacity: .5; margin-bottom: 8px; }

.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.phead { height: 61px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 32px 0 20px; border-bottom: 1px solid var(--border); }
.phead h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--fg2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--bg3); color: var(--fg); }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 10px; font-weight: 600; cursor: pointer; flex: none; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-secondary { background: var(--bg2); color: var(--fg); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--bg3); }

.body { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 40px; padding: 0 32px; position: relative; }
.main { flex: 1; max-width: 640px; min-width: 0; padding: 28px 0; overflow: auto; }
.msg { margin-bottom: 18px; color: var(--fg2); }
.msg.user { background: color-mix(in srgb, var(--accent) 12%, var(--bg3)); color: var(--fg); padding: 10px 14px; border-radius: 10px; margin-left: 80px; }

.rail { width: 280px; flex: none; padding: 28px 0; font-size: 13px; }
.rail-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
.rail-head h2 { font-size: 16px; margin: 0; }
.origin { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); margin-bottom: 18px; line-height: 1.45; color: var(--fg2); }
.origin a { color: var(--fg); font-weight: 650; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.rail-label { color: var(--fg3); margin: 0 0 6px; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); }
.kv span { color: var(--fg3); }
.sec { margin-bottom: 18px; }

/* Reopen tab when the rail is hidden */
.reopen { position: absolute; top: 16px; right: 24px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--fg2); cursor: pointer; font-size: 13px; }
.reopen:hover { color: var(--fg); border-color: var(--border-strong); }
.reopen.icon-only { padding: 0; width: 30px; justify-content: center; }

.tip { position: fixed; right: 16px; bottom: 16px; max-width: 320px; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--fg2); line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>c</b>ciaobot<div class="grow"></div><span class="ic">‹ › ▯</span></div>
    <div class="sk"></div><div class="sk"></div><div class="sk" style="opacity:.3"></div><div class="sk" style="opacity:.3"></div>
  </aside>
  <main class="pane">
    <header class="phead">
      <button class="icon-btn" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h1>Morning action briefing - Sep 25</h1>
      <button class="btn" id="archive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        Archive
      </button>
    </header>
    <div class="body" id="body"></div>
  </main>
</div>

<div class="proto-bar">
  <span>Archive button</span>
  <button data-arch="primary" aria-pressed="true">Primary (filled accent)</button>
  <button data-arch="secondary" aria-pressed="false">Secondary (outlined)</button>
  <span>Work details, when hidden</span>
  <button data-reopen="label" aria-pressed="true">"Work details" tab, top right</button>
  <button data-reopen="icon" aria-pressed="false">Icon only, top right</button>
</div>
<div class="tip">Hide the rail with the icon next to "Work details". It comes back from the tab in the chat's top-right corner. On a narrow pane, the same tab opens the drawer.</div>

<script>
let railOpen = true, arch = 'primary', reopen = 'label'
const railIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><line x1="15" y1="4" x2="15" y2="20"/></svg>`

function render() {
  document.getElementById('archive').className = 'btn ' + (arch === 'primary' ? 'btn-primary' : 'btn-secondary')
  const chat = `<div class="main">
      <div class="msg user">Run the morning action briefing for today.</div>
      <div class="msg">Here is today's briefing. Three items need you before 12:00…</div>
      <div class="msg user">Don't add it as stuff I need to do, it just tagged me. Add this to the schedule.</div>
      <div class="msg">Schedule updated. Now updating the daily log to close out the remaining items.</div>
    </div>`
  const rail = `<aside class="rail" id="rail">
      <div class="origin">⏱<div>This chat comes from the automation <a href="#">Morning action briefing</a>.</div></div>
      <div class="rail-head"><h2>Work details</h2>
        <button class="icon-btn" id="hide" aria-label="Hide work details" title="Hide work details">${railIcon}</button></div>
      <div class="sec"><p class="rail-label">Project · injected with each message</p>
        <div><a href="#" style="color:var(--fg);font-weight:650">General</a> — Pointer to general.md, the canonical doc for the work General project.</div></div>
      <div class="sec"><p class="rail-label">Run state</p>
        <div class="kv"><span>Current state</span><strong>Idle</strong></div>
        <div class="kv"><span>Background agents</span><strong>0</strong></div>
        <div class="kv"><span>Pending questions</span><strong>0</strong></div></div>
      <div class="sec"><p class="rail-label">Files</p><div style="color:var(--fg2)">2026-09-25.md</div></div>
    </aside>`
  const tab = `<button class="reopen ${reopen === 'icon' ? 'icon-only' : ''}" id="show" aria-label="Show work details" title="Show work details">${railIcon}${reopen === 'label' ? 'Work details' : ''}</button>`
  document.getElementById('body').innerHTML = chat + (railOpen ? rail : tab)
  document.getElementById('hide')?.addEventListener('click', () => { railOpen = false; render(); document.getElementById('show').focus() })
  document.getElementById('show')?.addEventListener('click', () => { railOpen = true; render(); document.getElementById('hide').focus() })
}
document.querySelectorAll('[data-arch]').forEach(b => b.onclick = () => {
  arch = b.dataset.arch; document.querySelectorAll('[data-arch]').forEach(x => x.setAttribute('aria-pressed', x === b)); render()
})
document.querySelectorAll('[data-reopen]').forEach(b => b.onclick = () => {
  reopen = b.dataset.reopen; document.querySelectorAll('[data-reopen]').forEach(x => x.setAttribute('aria-pressed', x === b)); render()
})
render()
</script>
</body>
</html>
