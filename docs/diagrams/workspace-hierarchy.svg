<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
<title id="title">Workspace → Project → Chat hierarchy</title>
<desc id="desc">Sidebar workspaces own a vault slice; each workspace holds projects; each project holds chats. Vault path annotated.</desc>
<style>
  .bg { fill: #f4f4fa; }
  .card { fill: #ffffff; stroke: #d2d4e3; stroke-width: 1.2; rx: 10; }
  .card-accent { stroke: #ff4d6d; stroke-width: 1.6; }
  .label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12px; fill: #1a1a2e; }
  .sublabel { font-family: SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #5f607d; }
  .mono { font-family: SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10.5px; fill: #5f607d; }
  .arrow { stroke: #b4b4c4; stroke-width: 1.6; fill: none; marker-end: url(#arrowhead); }
  .dot-pink { fill: #ff4d6d; }
  .dot-cyan { fill: #06b6d4; }
  .dot-amber { fill: #f59e0b; }
  .badge { fill: #e6e8f4; rx: 6; }
</style>
<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4b4c4"/>
  </marker>
</defs>
<rect width="720" height="200" rx="12" class="bg"/>

<!-- Column 1: Workspaces -->
<rect x="16" y="16" width="190" height="168" rx="10" class="card card-accent"/>
<text x="28" y="36" class="label" font-weight="700">Workspace</text>
<text x="28" y="50" class="sublabel">life area · owns vault slice</text>
<g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
  <circle cx="32" cy="70" r="6" class="dot-pink"/><text x="46" y="74" class="label">personal</text>
  <circle cx="32" cy="92" r="6" class="dot-cyan"/><text x="46" y="96" class="label">work</text>
  <circle cx="32" cy="114" r="6" class="dot-amber"/><text x="46" y="118" class="label">client-acme</text>
</g>
<rect x="26" y="132" width="170" height="38" rx="6" class="badge"/>
<text x="34" y="146" class="mono">&lt;ws&gt;/memory-vault/</text>
<text x="34" y="160" class="mono">e.g. personal/</text>

<!-- Arrow 1 -->
<line x1="206" y1="100" x2="250" y2="100" class="arrow"/>

<!-- Column 2: Projects -->
<rect x="250" y="16" width="210" height="168" rx="10" class="card"/>
<text x="262" y="36" class="label" font-weight="700">Project</text>
<text x="262" y="50" class="sublabel">folder + doc · injects [Project context]</text>
<rect x="262" y="62" width="186" height="34" rx="8" fill="#ffffff" stroke="#2e3258" stroke-width="1" stroke-dasharray="0"/>
<text x="272" y="76" class="label" font-size="11">✦ general</text>
<text x="272" y="88" class="mono" font-size="9">projects/active/general/</text>
<rect x="262" y="102" width="186" height="34" rx="8" fill="#ffffff" stroke="#ff4d6d" stroke-width="1.4"/>
<text x="272" y="116" class="label" font-size="11">◆ q4-planning</text>
<text x="272" y="128" class="mono" font-size="9">projects/active/q4-planning/</text>
<rect x="262" y="142" width="186" height="30" rx="8" fill="#ffffff" stroke="#d2d4e3" stroke-width="1"/>
<text x="272" y="160" class="label" font-size="11">○ trip-2026</text>

<!-- Arrow 2 -->
<line x1="460" y1="100" x2="504" y2="100" class="arrow"/>

<!-- Column 3: Chats -->
<rect x="504" y="16" width="200" height="168" rx="10" class="card"/>
<text x="516" y="36" class="label" font-weight="700">Chat</text>
<text x="516" y="50" class="sublabel">turns · subagents · automations</text>
<g>
  <rect x="516" y="62" width="176" height="26" rx="7" fill="#f4f4fa" stroke="#d2d4e3"/>
  <text x="526" y="79" class="label" font-size="11">↻ check PRs (loop)</text>
  <rect x="516" y="94" width="176" height="26" rx="7" fill="#ffffff" stroke="#d2d4e3"/>
  <text x="526" y="111" class="label" font-size="11">▸ Research notes</text>
  <rect x="516" y="126" width="176" height="26" rx="7" fill="#ffffff" stroke="#d2d4e3"/>
  <text x="526" y="143" class="label" font-size="11">▸ Draft outline</text>
  <rect x="516" y="158" width="176" height="14" rx="4" fill="#e6e8f4"/>
  <text x="522" y="168" class="mono" font-size="8">+ New chat in q4-planning</text>
</g>
</svg>
