# Stock categories that used to ship and no longer do. They are not part of the
# effective list. A vault whose entity-types.yaml still carries a row for one
# (for example `enabled: false` on Document) keeps it as a complete custom
# entry, which is what `entity_types` merges these definitions for. Same shape
# as stock entity-types.yaml; `log` is not here because it became an alias of
# `journal` instead.
- id: product
  label: Product
  kind: note
  folder: products
  description: A product, service or line the user ships or sells. Use for versions, pricing, positioning.
  aliases: []
  enabled: true
- id: feature
  label: Feature
  kind: note
  folder: features
  description: A capability of one product. Use for scope, state and spec-level detail.
  aliases: [feature-brief]
  enabled: true
- id: automation
  label: Automation
  kind: note
  folder: automations
  description: A recurring or triggered routine. Use for what it does, when it fires, how it failed.
  aliases: []
  enabled: true
- id: document
  label: Document
  kind: note
  folder: Documents
  description: A durable document of the user's own. Use for plans, templates and written material.
  aliases: [doc, plan, planning-doc, template]
  enabled: true
- id: reference
  label: Reference
  kind: note
  folder: references
  description: Material quoted from elsewhere. Use for external analysis and citations.
  aliases: [analysis]
  enabled: true
- id: content
  label: Content
  kind: note
  folder: content
  description: Something to publish. Use for drafts, posts and published material.
  aliases: []
  enabled: true
