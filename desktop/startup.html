<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Ciaobot</title>
    <link rel="stylesheet" href="/src/desktop.css" />
  </head>
  <body data-window="startup">
    <main class="startup">
      <div class="startup-mark" aria-hidden="true">›</div>
      <p class="eyebrow">Ciaobot</p>
      <h1>Waiting for the engine</h1>
      <p>
        Ciaobot will open automatically when the local engine is ready.
      </p>
      <p class="hint">
        If this screen remains, update the Ciaobot engine and choose
        <strong>Start Engine</strong> from the menu-bar icon.
      </p>
      <div class="startup-progress" aria-label="Waiting for engine"></div>
    </main>
  </body>
</html>
