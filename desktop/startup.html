<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciaobot</title>
    <link rel="stylesheet" href="/src/desktop.css" />
  </head>
  <body data-window="startup">
    <main class="startup" id="startup-screen">
      <!-- Engine unreachable: boot-style waiting state. -->
      <section class="startup-state startup-state--waiting" id="waiting-state">
        <div class="startup-head">
          <span class="wordmark" aria-label="Ciaobot">ciaobot</span>
          <span class="startup-version">waiting · engine</span>
        </div>

        <div class="startup-progress" aria-label="Waiting for the engine">
          <span class="startup-progress-track">░░░░░░░░░░░░░░░░░░░░░░░░░░░░</span>
          <span class="startup-progress-pct">…</span>
        </div>

        <p class="startup-hint">
          Ciaobot will open automatically when the local engine is ready.
          If this screen remains, update the Ciaobot engine and choose
          <strong>Start Engine</strong> from the menu-bar icon.
        </p>

        <div class="startup-foot">
          <span class="startup-prompt">$</span>
          <span class="startup-prompt-text">waiting</span>
          <span class="caret" aria-hidden="true"></span>
        </div>
      </section>

      <!-- Update in progress: boot-style progress + log rows. -->
      <section class="startup-state startup-state--update" id="update-state" hidden aria-live="polite">
        <div class="startup-head">
          <span class="wordmark" aria-label="Ciaobot">ciaobot</span>
          <span class="startup-version" id="update-eyebrow">update · in progress</span>
        </div>

        <div
          class="startup-progress"
          role="progressbar"
          aria-label="Update progress"
          aria-valuemin="0"
          aria-valuemax="100"
          id="update-progress"
        >
          <span class="startup-progress-track" id="update-track"></span>
          <span class="startup-progress-pct" id="update-percent">000%</span>
        </div>

        <ul class="startup-log" id="update-log" role="log"></ul>

        <div class="startup-foot" id="update-foot">
          <span class="startup-prompt" id="update-prompt">$</span>
          <span class="startup-prompt-text" id="update-prompt-text">updating</span>
          <span class="caret" aria-hidden="true"></span>
        </div>
      </section>
    </main>

    <script>
      const PROGRESS_WIDTH = 28

      const waitingState = document.querySelector('#waiting-state')
      const updateState = document.querySelector('#update-state')
      const updateEyebrow = document.querySelector('#update-eyebrow')
      const updateTrack = document.querySelector('#update-track')
      const updatePercent = document.querySelector('#update-percent')
      const updateProgress = document.querySelector('#update-progress')
      const updateLog = document.querySelector('#update-log')
      const updatePrompt = document.querySelector('#update-prompt')
      const updatePromptText = document.querySelector('#update-prompt-text')
      const updateFoot = document.querySelector('#update-foot')

      // A Rust progress line looks like
      // "[ciao] local engine checked ....................... ok".
      // Split it into the boot screen's columns: name, dots, status.
      function parseLine(line) {
        const stripped = String(line).replace(/^\[ciao\]\s*/, '')
        const m = stripped.match(/^(.*?)\s+(\.{3,})\s+(.*)$/)
        if (!m) return { name: stripped, dots: '', status: 'wait' }
        const [, name, dots, tail] = m
        let status = 'wait'
        if (tail === 'ok') status = 'done'
        else if (tail === 'in progress') status = 'in_progress'
        else if (/^\d+%$/.test(tail)) status = 'in_progress'
        else status = 'failed'
        return { name, dots, status }
      }

      function renderRow(row) {
        const li = document.createElement('li')
        li.className = 'startup-log-row is-' + row.status
        const ts = document.createElement('span')
        ts.className = 'startup-log-ts'
        ts.textContent = '[ciao]'
        const name = document.createElement('span')
        name.className = 'startup-log-name'
        name.textContent = row.name
        const dots = document.createElement('span')
        dots.className = 'startup-log-dots'
        dots.textContent = row.dots
        const status = document.createElement('span')
        status.className = 'startup-log-status'
        status.textContent =
          row.status === 'done' ? 'ok' :
          row.status === 'in_progress' ? '…' : 'fail'
        li.append(ts, name, dots, status)
        return li
      }

      function renderUpdate(detail) {
        const percent = Math.max(0, Math.min(100, Number(detail.percent) || 0))
        const lines = Array.isArray(detail.lines) ? detail.lines : []
        const failed = detail.status === 'error'

        waitingState.hidden = true
        updateState.hidden = false

        updateEyebrow.textContent = failed ? 'update · needs attention' : 'update · in progress'

        const filled = Math.round((percent / 100) * PROGRESS_WIDTH)
        updateTrack.textContent = '█'.repeat(filled) + '░'.repeat(PROGRESS_WIDTH - filled)
        updatePercent.textContent = String(percent).padStart(3, ' ') + '%'
        updateProgress.setAttribute('aria-label', failed ? 'Update failed' : 'Update progress')
        updateProgress.setAttribute('aria-valuenow', String(percent))

        updateLog.replaceChildren(...lines.map(parseLine).map(renderRow))

        if (failed) {
          updatePrompt.textContent = '[fail]'
          updatePromptText.textContent = 'update stopped — the current installation is still available'
          updateFoot.classList.add('is-failed')
        } else {
          updatePrompt.textContent = '$'
          updatePromptText.textContent = 'updating'
          updateFoot.classList.remove('is-failed')
        }
        updateState.dataset.status = failed ? 'error' : 'running'
      }

      window.addEventListener('ciao:update-progress', (event) => {
        renderUpdate(event.detail || {})
      })
    </script>
  </body>
</html>
