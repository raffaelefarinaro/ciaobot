[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciaobot"
version = "0.8.0"
description = "Ciaobot personal assistant server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "claude-agent-sdk==0.2.134",
  # Agent-facing control plane shared by Claude Code and Codex.
  "mcp>=1.29.0,<2.0",
  "starlette==0.52.1",
  "uvicorn[standard]==0.51.0",
  "itsdangerous==2.2.0",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "pywebpush==2.3.0",
  # 49.0.0 dropped the macOS universal2 wheel; keep Intel bundled builds
  # binary-only until the upstream release restores one.
  "cryptography==48.0.0",
  # `websockets` is already pulled in transitively by uvicorn[standard].
  "httpx==0.28.1",
  "python-pptx==1.0.2",
  "notebooklm-py==0.8.0",
]

[project.optional-dependencies]
test = [
  "build==1.5.0",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
]
# Optional web-scraping fallback for the web-research skill (JS-rendered
# pages defuddle cannot read). Browser binaries are installed separately
# with `scrapling install`, keeping the base install light.
scraping = [
  "scrapling[fetchers]==0.4.11",
]

[project.scripts]
ciao = "ciao.cli:main"
ciaobot = "ciao.cli:main"
ciao-public-preflight = "ciao.public_release:main"
ciao-package-smoke = "ciao.package_smoke:main"
ciao-prepare-release = "ciao.release:main"

[tool.setuptools]
packages = ["ciao", "ciao.context", "ciao.observability", "ciao.providers", "ciao.stock", "ciao.web"]

[tool.setuptools.package-data]
"ciao" = ["system_prompt.md"]
"ciao.web" = ["static/**/*"]
"ciao.stock" = [
  "agents/*.md",
  "commands/*.md",
  "deploy/*.tmpl",
  "deploy/*.icns",
  "deploy/*.png",
  "deploy/*.svg",
  "public/*.md",
  "workspace/*.md",
  "skills/.gitkeep",
  "skills/**/*",
  "schedules.json",
  "schedules/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.coverage.run]
source = ["ciao"]
omit = [
  "ciao/stock/*",
  "tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
