[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciaobot"
version = "1.1.0"
description = "Ciaobot personal assistant server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "claude-agent-sdk[otel]==0.2.163",
  # Runtime security pins for transitive dependencies (#953, #1081). `mcp`
  # accepts PyJWT[crypto]>=2.10.1, `pywebpush`->`requests` accepts
  # urllib3>=1.26,<3, and `mcp`->`aiohttp` (3.14.3) accepts
  # multidict>=4.5,<7.0, but a wheel install resolves published Requires-Dist
  # rather than uv.lock, so the patched floor has to be declared here too.
  # multidict is a transitive of a transitive and is pinned for reachability on
  # CVE-2026-104874 (fixed 6.9.1) rather than for a reproduced Ciaobot
  # behaviour. Drop these once the owners raise their own floors above the
  # patched versions.
  "PyJWT[crypto]==2.15.1",
  "urllib3==2.8.0",
  "multidict==6.9.1",
  # Agent-facing control plane shared by Claude Code and Codex.
  "mcp>=1.29.0,<2.0",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
  "itsdangerous==2.2.0",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.3",
  "pywebpush==2.5.0",
  "cryptography==50.0.2",
  # `websockets` is already pulled in transitively by uvicorn[standard].
  "httpx==0.28.1",
  "firecrawl-anydoc>=0.2.4,<0.3.0",
  # Windows has no system tz database, so without this `zoneinfo.ZoneInfo`
  # (schedules, operator actions) cannot find any zone, not even UTC.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
  "build==1.6.1",
  "wheel>=0.45",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
]

[project.scripts]
ciao = "ciao.cli:main"
ciaobot = "ciao.cli:main"
ciao-public-preflight = "ciao.public_release:main"
ciao-package-smoke = "ciao.package_smoke:main"
ciao-prepare-release = "ciao.release:main"

[tool.setuptools]
# Auto-discover every subpackage of the engine so a new top-level module
# is included in the wheel without a manual
# edit here. Anything dropped into ciao/ that is not a private name (no
# leading underscore) becomes part of the published package, which is the
# behavior the release pipeline needs to avoid shipping a wheel that
# references a module the installer never sees.
#
# Without this, the Homebrew 0.7.0 install referenced a new top-level module
# from ciao/insights.py but the file itself was missing from the wheel, and
# every archive job crashed with AttributeError (issue #256).
[tool.setuptools.packages.find]
include = ["ciao*"]
namespaces = false

[tool.setuptools.package-data]
"ciao" = ["system_prompt.md"]
"ciao.web" = ["static/**/*"]
"ciao.stock" = [
  "agents/*.md",
  "commands/*.md",
  "deploy/*.tmpl",
  "deploy/*.icns",
  "deploy/*.png",
  "deploy/*.svg",
  "evals/*.json",
  "entity-types.yaml",
  "retired-entity-types.yaml",
  "public/*.md",
  "workspace/*.md",
  "skills/.gitkeep",
  "skills/**/*",
  "schedules.json",
  "schedules/*.md",
  "update-tasks/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.coverage.run]
source = ["ciao"]
omit = [
  "ciao/stock/*",
  "tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
