[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciaobot"
version = "0.13.0"
description = "Ciaobot personal assistant server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "claude-agent-sdk[otel]==0.2.148",
  # Agent-facing control plane shared by Claude Code and Codex.
  "mcp>=1.29.0,<2.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
  "itsdangerous==2.2.0",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "pywebpush==2.3.0",
  "cryptography==50.0.0",
  # `websockets` is already pulled in transitively by uvicorn[standard].
  "httpx==0.28.1",
  "firecrawl-anydoc>=0.2.4,<0.3.0",
]

[project.optional-dependencies]
test = [
  "build==1.5.0",
  "wheel>=0.45",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
]
# Optional web-scraping fallback for the web-research skill (JS-rendered
# pages defuddle cannot read). Browser binaries are installed separately
# with `scrapling install`, keeping the base install light.
scraping = [
  "scrapling[fetchers]==0.4.11",
]

[project.scripts]
ciao = "ciao.cli:main"
ciaobot = "ciao.cli:main"
ciao-public-preflight = "ciao.public_release:main"
ciao-package-smoke = "ciao.package_smoke:main"
ciao-prepare-release = "ciao.release:main"

[tool.setuptools]
# Auto-discover every subpackage of the engine so a new top-level module
# (e.g. ciao/native_sidecar.py) is included in the wheel without a manual
# edit here. Anything dropped into ciao/ that is not a private name (no
# leading underscore) becomes part of the published package, which is the
# behavior the release pipeline needs to avoid shipping a wheel that
# references a module the installer never sees.
#
# Without this, the Homebrew 0.7.0 install referenced
# ciao.native_sidecar.is_apple_model from ciao/insights.py but the file
# itself was missing from the wheel, and every archive job crashed with
# AttributeError (issue #256).
[tool.setuptools.packages.find]
include = ["ciao*"]
namespaces = false

[tool.setuptools.package-data]
"ciao" = ["system_prompt.md"]
"ciao.web" = ["static/**/*"]
"ciao.stock" = [
  "agents/*.md",
  "commands/*.md",
  "deploy/*.tmpl",
  "deploy/*.icns",
  "deploy/*.png",
  "deploy/*.svg",
  "public/*.md",
  "workspace/*.md",
  "skills/.gitkeep",
  "skills/**/*",
  "schedules.json",
  "schedules/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.coverage.run]
source = ["ciao"]
omit = [
  "ciao/stock/*",
  "tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
