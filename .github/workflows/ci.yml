name: Ciao CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          desktop/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[test]'

    - name: Python static type check
      run: |
        mypy ciao

    - name: Python dependency security audit
      run: |
        pip-audit --desc || true

    - name: Run pytest with coverage
      run: |
        pytest --cov=ciao --cov-report=term-missing tests/

    - name: Install frontend dependencies
      run: |
        cd web
        npm ci

    - name: Frontend lint check
      run: |
        cd web
        npm run lint || true

    - name: Frontend dependency audit
      run: |
        cd web
        npm audit --audit-level=high || true

    - name: Run frontend tests
      run: |
        cd web
        npm run test

    - name: Build PWA
      run: |
        cd web
        npm run build

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.90.0
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin
        components: rustfmt,clippy

    # The embedded x86_64 runtime may build a native dependency from source
    # under Rosetta. Select a universal Xcode before that build so its linker
    # and SDK are usable by both architecture toolchains.
    - name: Select newest Xcode
      run: |
        newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        if [ -z "$newest" ]; then
          echo "No Xcode found under /Applications" >&2
          exit 1
        fi
        echo "Selecting $newest"
        sudo xcode-select -s "$newest"
        xcodebuild -version
        swiftc --version

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Resolve pinned Python runtimes
      id: python-runtime
      shell: bash
      run: |
        set -euo pipefail
        . scripts/pinned-python-runtime.env
        {
          echo "arm64_url=$CIAO_PYTHON_ARM64_URL"
          echo "arm64_sha256=$CIAO_PYTHON_ARM64_SHA256"
          echo "x86_64_url=$CIAO_PYTHON_X86_64_URL"
          echo "x86_64_sha256=$CIAO_PYTHON_X86_64_SHA256"
        } >> "$GITHUB_OUTPUT"

    - name: Build embedded Ciaobot runtime
      env:
        CIAO_PYTHON_ARM64_URL: ${{ steps.python-runtime.outputs.arm64_url }}
        CIAO_PYTHON_ARM64_SHA256: ${{ steps.python-runtime.outputs.arm64_sha256 }}
        CIAO_PYTHON_X86_64_URL: ${{ steps.python-runtime.outputs.x86_64_url }}
        CIAO_PYTHON_X86_64_SHA256: ${{ steps.python-runtime.outputs.x86_64_sha256 }}
      run: ./scripts/build-bundled-runtime.sh desktop/runtime

    - name: Install desktop dependencies
      working-directory: desktop
      run: npm ci

    - name: Build desktop UI
      working-directory: desktop
      run: npm run build

    - name: Build native sidecar
      working-directory: desktop
      # Must run before any cargo invocation: tauri.conf.json declares the
      # sidecar as an externalBin, so the build script fails with "resource
      # path ... doesn't exist" if the binary is absent. `npm run tauri build`
      # below builds it via the pretauri hook, but clippy/fmt/test call cargo
      # directly and would never trigger it. The binaries are gitignored
      # because they are build output.
      run: npm run build:native

    - name: Check desktop Rust formatting
      working-directory: desktop/src-tauri
      run: cargo fmt --check

    - name: Lint desktop Rust
      working-directory: desktop/src-tauri
      run: cargo clippy --all-targets -- -D warnings

    - name: Test desktop Rust
      working-directory: desktop/src-tauri
      run: cargo test

    - name: Build macOS app bundle
      working-directory: desktop
      run: >-
        npm run tauri build --
        --bundles app
        --config '{"bundle":{"createUpdaterArtifacts":false}}'

    # Exercise the cold-start path of the bundle built from this branch, using
    # the same embedded runtime layout that the release workflow ships.
    - name: Cold-start the built app and wait for the engine
      run: |
        app="desktop/src-tauri/target/release/bundle/macos/Ciaobot.app"
        test -d "$app"
        engine="$app/Contents/Resources/ciao-runtime/bin/ciao"
        test -x "$engine"
        "$engine" setup --workspace "${RUNNER_TEMP}/ci-workspace" --app-dir "${RUNNER_TEMP}/ci-apps"
        # Locally built bundles are not quarantined, but be explicit: a
        # Gatekeeper wait on a quarantined bundle is what pinned the app in
        # _dyld_start and kept release-smoke red across v0.6.3 and v0.6.4.
        xattr -dr com.apple.quarantine "$app" 2>/dev/null || true
        open -g "$app" --args --background >"${RUNNER_TEMP}/ci-open.log" 2>&1 &
        for _ in {1..30}; do
          pgrep -x ciaobot-desktop >/dev/null && break
          sleep 1
        done
        # pgrep only proves the process exists; the engine probe below is what
        # proves the app actually ran.
        pgrep -x ciaobot-desktop >/dev/null
        for _ in {1..45}; do
          curl -fsS http://localhost:8443/api/startup-status >/dev/null 2>&1 && break
          sleep 1
        done
        curl -fsS http://localhost:8443/api/startup-status | jq -e '.desktop_api_version == 1'

    - name: Cold-start diagnostics
      if: failure()
      run: |
        workspace="${RUNNER_TEMP}/ci-workspace"
        echo "--- processes ---"
        pgrep -lf 'ciaobot|ciao' || echo "(none)"
        echo "--- listening TCP sockets ---"
        lsof -nP -iTCP -sTCP:LISTEN || true
        echo "--- launchd state ---"
        launchctl print "gui/$(id -u)/com.ciao.server" 2>&1 | head -30 || true
        echo "--- app stack sample ---"
        app_pid="$(pgrep -x ciaobot-desktop || true)"
        if [ -n "$app_pid" ]; then
          sample "$app_pid" 2 -file "${RUNNER_TEMP}/ci-sample.txt" >/dev/null 2>&1 || true
          sed -n '1,80p' "${RUNNER_TEMP}/ci-sample.txt" 2>/dev/null || echo "(sample unavailable)"
        else
          echo "(app not running)"
        fi
        echo "--- desktop-service status ---"
        ciao desktop-service status --json 2>&1 | head -20 || true
        echo "--- app launch log ---"
        cat "${RUNNER_TEMP}/ci-open.log" 2>/dev/null || echo "(absent)"
        for log in ciao.stderr.log ciao.stdout.log desktop-tray.log; do
          echo "--- ${log} ---"
          tail -60 "${workspace}/.runtime/${log}" 2>/dev/null || echo "(absent)"
        done

    - name: Stop the app and engine
      if: always()
      run: |
        pkill -x ciaobot-desktop || true
        ciao desktop-service stop --force >/dev/null 2>&1 || true

    - name: Smoke-test package
      run: |
        ciao package-smoke --skip-frontend
