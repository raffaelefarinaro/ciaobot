name: Ciao CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          desktop/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[test]'

    - name: Python static type check
      run: |
        mypy ciao

    - name: Python dependency security audit
      run: |
        pip-audit --desc || true

    - name: Run pytest with coverage
      run: |
        pytest --cov=ciao --cov-report=term-missing tests/

    - name: Install frontend dependencies
      run: |
        cd web
        npm ci

    - name: Frontend lint check
      run: |
        cd web
        npm run lint || true

    - name: Frontend dependency audit
      run: |
        cd web
        npm audit --audit-level=high || true

    - name: Run frontend tests
      run: |
        cd web
        npm run test

    - name: Build PWA
      run: |
        cd web
        npm run build

    - name: Install desktop dependencies
      working-directory: desktop
      run: npm ci

    - name: Build desktop UI
      working-directory: desktop
      run: npm run build

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.90.0
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin
        components: rustfmt,clippy

    - name: Check desktop Rust formatting
      working-directory: desktop/src-tauri
      run: cargo fmt --check

    - name: Lint desktop Rust
      working-directory: desktop/src-tauri
      run: cargo clippy --all-targets -- -D warnings

    - name: Test desktop Rust
      working-directory: desktop/src-tauri
      run: cargo test

    - name: Build macOS app bundle
      working-directory: desktop
      run: >-
        npm run tauri build --
        --bundles app
        --config '{"bundle":{"createUpdaterArtifacts":false}}'

    - name: Smoke-test wheel
      run: |
        ciao package-smoke --skip-frontend
