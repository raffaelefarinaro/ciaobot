name: Ciao CI

on:
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

# The suite only needs to check out code and run tests; the GITHUB_TOKEN never
# needs to write anything.
permissions:
  contents: read

# A newer PR head supersedes its older run; full manual runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux is the gate every PR waits on, split into two parallel jobs:
# `linux-server` (mypy, pytest -n auto, package smoke) and `linux-web` (vitest
# and the PWA build). A develop PR whose diff changes `web/` also waits on
# `linux-e2e`, which builds and tests this checkout in Chromium alongside the
# unit/build job, after the fast `web-scope` detector. The detector
# uses the PR's base/head commits and full history from the merge checkout.
# `mac-app` builds and tests the Swift Mac app in `mac/` on macOS 15; on
# develop PRs only when the diff changes `mac/`, `pyproject.toml`, `uv.lock` or
# the engine colour table it pins (the `mac-scope` detector), and always on
# release PRs and manual runs. The app bundle includes the full engine, so
# `mac-app` builds it whenever it runs on macOS. Changes under `ciao/` or
# `web/` alone do not trigger `mac-app` on a develop PR (#3128 M4); the engine
# build of such changes runs on release PRs and manual dispatch.
# `linux-server-latest-python` runs the same backend gates
# on the newest Python `requires-python` admits (3.14) on release and manual
# runs; it is a required check on main. `test` is the macOS job —
# coverage, browser tests, the launchd service, and an engine wheel built from
# this branch, installed into a throwaway venv and cold-started. It is the only
# place the launchd, installer, engine-update and migration machinery runs on
# the real platform. It runs on release PRs and manual runs. Web changes in develop PRs are covered by
# `linux-e2e`.
jobs:
  linux-server:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install Python dependencies
      run: python -m pip install -e '.[test]'
    - name: Python static type check
      run: mypy ciao
    - name: Linux backend tests
      run: pytest -n auto tests/

  # `requires-python` admits every release from 3.12 up, and installers pick
  # the newest interpreter, so the backend gates also run on the newest Python
  # Ciaobot supports. A separate job (not a matrix) keeps the required
  # `linux-server` check name unchanged.
  linux-server-latest-python:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Install Python dependencies
      run: python -m pip install -e '.[test]'
    - name: Python static type check
      run: mypy --python-version 3.14 ciao
    - name: Linux backend tests
      run: pytest -n auto tests/

  # Detection is independent of unit/build work so Chromium starts immediately.
  web-scope:
    outputs:
      web_changed: ${{ steps.web-changes.outputs.web_changed }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Detect web changes
      id: web-changes
      if: github.event_name == 'pull_request' && github.base_ref == 'develop'
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        for name in PR_BASE_SHA PR_HEAD_SHA; do
          value="${!name:-}"
          if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::${name} must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${value}^{commit}"; then
            echo "::error::${name} is unavailable as a commit in this checkout" >&2
            exit 1
          fi
        done
        web_paths="$(git diff --no-renames --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- web/)"
        if [[ -n "$web_paths" ]]; then
          printf 'web_changed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'web_changed=false\n' >> "$GITHUB_OUTPUT"
        fi

  # Package smoke needs the PWA built here; e2e builds its own tested bundle.
  linux-web:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install frontend dependencies
      working-directory: web
      run: npm ci
    - name: Frontend tests
      working-directory: web
      run: npm test
    - name: Build PWA
      working-directory: web
      run: npm run build
    - name: Install Python package
      run: python -m pip install -e .
    - name: Smoke-test installed package
      run: ciao package-smoke --skip-frontend

  linux-e2e:
    needs: web-scope
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Require successful web scope detection
      env:
        SCOPE_RESULT: ${{ needs.web-scope.result }}
      run: test "$SCOPE_RESULT" = success
    - uses: actions/checkout@v7
      if: needs.web-scope.outputs.web_changed == 'true'
    - uses: actions/setup-node@v7
      if: needs.web-scope.outputs.web_changed == 'true'
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install frontend dependencies
      if: needs.web-scope.outputs.web_changed == 'true'
      working-directory: web
      run: npm ci
    - name: Install Chromium
      if: needs.web-scope.outputs.web_changed == 'true'
      working-directory: web
      run: npx playwright install --with-deps chromium
    # The workshop's gates ride the job that already holds node_modules and
    # Chromium: `build-storybook` also runs the story-index check, and
    # `test-storybook` executes every story and its play function in the same
    # browser. They are independent signals, so the runner runs even when the
    # build failed (`!cancelled()`) and one failure cannot mask the other;
    # the job still fails. They stay out of linux-web so backend-only PRs
    # pay none of it.
    - name: Build Storybook
      if: needs.web-scope.outputs.web_changed == 'true'
      working-directory: web
      run: npm run build-storybook
    - name: Run Storybook browser runner
      if: ${{ needs.web-scope.outputs.web_changed == 'true' && !cancelled() }}
      working-directory: web
      run: npm run test-storybook
    - name: Run browser suite
      if: needs.web-scope.outputs.web_changed == 'true'
      working-directory: web
      run: npm run test:e2e
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: linux-playwright-traces
        path: web/test-results/
        retention-days: 7
        if-no-files-found: ignore

  # Detection is separate so a develop PR that does not touch mac/,
  # pyproject.toml or uv.lock never waits for a macOS runner. Release PRs and manual runs always build it.
  mac-scope:
    outputs:
      mac_changed: ${{ steps.mac-changes.outputs.mac_changed || steps.mac-full.outputs.mac_changed }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Detect mac changes
      id: mac-changes
      if: github.event_name == 'pull_request' && github.base_ref == 'develop'
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        for name in PR_BASE_SHA PR_HEAD_SHA; do
          value="${!name:-}"
          if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::${name} must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${value}^{commit}"; then
            echo "::error::${name} is unavailable as a commit in this checkout" >&2
            exit 1
          fi
        done
        mac_paths="$(git diff --no-renames --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- mac/ web/src/lib/workspaceColors.ts pyproject.toml uv.lock)"
        if [[ -n "$mac_paths" ]]; then
          printf 'mac_changed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'mac_changed=false\n' >> "$GITHUB_OUTPUT"
        fi
    - name: Release and manual runs always build the Mac app
      id: mac-full
      if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'develop') }}
      run: printf 'mac_changed=true\n' >> "$GITHUB_OUTPUT"

  # Stable required check. Without a mac/, pyproject.toml or uv.lock change it
  # runs only the scope check, on Linux, so it never queues for a macOS runner.
  mac-app:
    needs: mac-scope
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.mac-scope.outputs.mac_changed == 'true' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
    - name: Require successful mac scope detection
      env:
        SCOPE_RESULT: ${{ needs.mac-scope.result }}
      run: test "$SCOPE_RESULT" = success
    - uses: actions/checkout@v7
      if: needs.mac-scope.outputs.mac_changed == 'true'
      with:
        persist-credentials: false
    - name: Require an Apple silicon runner
      if: needs.mac-scope.outputs.mac_changed == 'true'
      run: test "$(uname -m)" = arm64
    - uses: actions/setup-python@v7
      if: needs.mac-scope.outputs.mac_changed == 'true'
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v7
      if: needs.mac-scope.outputs.mac_changed == 'true'
      with:
        node-version: '22'
    - name: Restore the engine wheelhouse
      if: needs.mac-scope.outputs.mac_changed == 'true'
      uses: actions/cache@v6
      with:
        path: mac/.build/engine-cache
        key: mac-engine-wheelhouse-${{ hashFiles('pyproject.toml', 'uv.lock', 'mac/engine-runtime.json', 'mac/engine-build-inputs.json') }}
    - name: Toolchain
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: |
        xcodebuild -version
        swift --version
    - name: Swift tests
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: swift test
    - name: Swift build
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: swift build
    - name: Build local app bundle
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: scripts/build-app.sh
    - name: Verify packaged assets and icon
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: swift test --filter AppAssetsTests --filter BundledEngineTests
    - name: Validate bundle metadata
      if: needs.mac-scope.outputs.mac_changed == 'true'
      working-directory: mac
      run: plutil -lint .build/Ciaobot.app/Contents/Info.plist

  test:
    # Engine-only coverage that only the real platform can give. This job runs
    # on release PRs into main. Browser tests for changed web paths also run
    # pre-merge in linux-e2e.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[test]'

    - name: Python static type check
      run: |
        mypy ciao

    - name: Python dependency security audit
      run: |
        pip-audit --desc || true

    - name: Run pytest with coverage
      run: |
        pytest -n auto --cov=ciao --cov-report=term-missing tests/

    - name: Install frontend dependencies
      run: |
        cd web
        npm ci

    - name: Frontend lint check
      run: |
        cd web
        npm run lint || true

    - name: Frontend dependency audit
      run: |
        cd web
        npm audit --audit-level=high || true

    - name: Run frontend tests
      run: |
        cd web
        npm run test

    - name: Build PWA
      run: |
        cd web
        npm run build

    # Browser regression suite. It lives inside this job rather than in one of
    # its own so it reuses the node_modules and the build that the two steps
    # above just produced; the only marginal cost is the Chromium download,
    # which the cache below removes on every run but the first for a given
    # Playwright version.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

    - name: Install Playwright Chromium
      working-directory: web
      run: npx playwright install chromium

    # Blocking, with no retries configured. A browser test that only passes on
    # the second attempt is a broken test, and hiding that behind a retry is
    # how a suite ends up being ignored. The suite is hermetic (a synthetic
    # Node backend, no Python, no credentials, no sleeps), so if it ever does
    # flake the answer is to delete the offending spec, not to soften the gate.
    - name: Run PWA browser tests
      working-directory: web
      run: npm run test:e2e

    - name: Upload browser test traces
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces
        path: web/test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.8"

    # The release ships the engine wheel and nothing else (#653), so the
    # macOS-only coverage is the engine too: build the wheel this branch would
    # publish, install it the way a user gets it, and start the service.
    - name: Build engine wheel
      run: uv build --wheel --out-dir dist

    - name: Cold-start the built engine and wait for it
      run: |
        engine_venv="$RUNNER_TEMP/engine"
        engine="$engine_venv/bin/ciao"
        uv venv --python 3.12 "$engine_venv"
        uv pip install --python "$engine_venv/bin/python" dist/ciaobot-*.whl
        test -x "$engine"
        mkdir -p "${RUNNER_TEMP}/ci-workspace"
        # `--load-launchd` and `--python` are what scripts/install-engine.sh
        # passes: the LaunchAgent has to name this venv's ciao, and launchd has
        # to drop any job definition it already holds before service start.
        "$engine" setup --workspace "${RUNNER_TEMP}/ci-workspace" --app-dir "${RUNNER_TEMP}/ci-apps" --python "$engine" --load-launchd
        "$engine" service start --workspace "${RUNNER_TEMP}/ci-workspace"
        port="$(awk -F= '/^PWA_PORT=/{print $2}' "${RUNNER_TEMP}/ci-workspace/.env" 2>/dev/null | tr -d '"' | tail -1)"
        [ -n "$port" ] || port=8443
        for _ in {1..45}; do
          curl -fsS "http://localhost:$port/api/startup-status" >/dev/null 2>&1 && break
          sleep 1
        done
        curl -fsS "http://localhost:$port/api/startup-status" >/dev/null

    - name: Cold-start diagnostics
      if: failure()
      run: |
        workspace="${RUNNER_TEMP}/ci-workspace"
        echo "--- processes ---"
        pgrep -lf 'ciao|uv' || echo "(none)"
        echo "--- listening TCP sockets ---"
        lsof -nP -iTCP -sTCP:LISTEN || true
        echo "--- launchd state ---"
        launchctl print "gui/$(id -u)/com.ciao.server" 2>&1 | head -30 || true
        echo "--- workspace .env ---"
        cat "${workspace}/.env" 2>/dev/null || echo "(absent)"
        for log in ciao.stderr.log ciao.stdout.log; do
          echo "--- ${log} ---"
          tail -60 "${workspace}/.runtime/${log}" 2>/dev/null || echo "(absent)"
        done

    - name: Stop the engine
      if: always()
      run: |
        ciao service stop --force >/dev/null 2>&1 || true

    - name: Smoke-test package
      run: |
        ciao package-smoke --skip-frontend
