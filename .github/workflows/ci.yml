name: Ciao CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

# The suite only needs to check out code and run tests; the GITHUB_TOKEN never
# needs to write anything.
permissions:
  contents: read

# Two tiers. `linux-server` is the gate every PR waits on: the same blocking
# steps a contributor runs locally (mypy, pytest, frontend tests, build), with
# pytest parallelized. `test` is the full macOS job — coverage, browser tests,
# the launchd service, and an engine wheel built from this branch, installed
# into a throwaway venv and cold-started. It is the only place the launchd,
# installer, engine-update and migration machinery runs on the real platform,
# and nothing here needs a diff to decide that: it runs on every push to
# develop and on every PR to main (release cuts). A macOS-only regression in a
# develop PR therefore surfaces on the post-merge push run instead, before any
# release can ship it.
#
# `windows` is the native Windows port's (#696) advisory job: it measures and
# never fails. It runs on every PR and push so each port PR shows its before
# and after counts in the job summary, and it becomes a blocking gate at #696's
# C9 checkpoint once the suite is green there.
jobs:
  linux-server:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Python dependencies
      run: python -m pip install -e '.[test]'
    - name: Python static type check
      run: mypy ciao
    - name: Linux backend tests
      run: pytest -n auto tests/
    - name: Install frontend dependencies
      working-directory: web
      run: npm ci
    - name: Frontend tests
      working-directory: web
      run: npm test
    - name: Build PWA
      working-directory: web
      run: npm run build
    - name: Smoke-test installed package
      run: ciao package-smoke --skip-frontend

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install Python dependencies
      run: python -m pip install -e '.[test]'
    # Blocking since C9 (#696): every module imports, mypy's win32 pass is
    # clean, and the backend and frontend suites pass. Each gate writes its log
    # and the job fails on it; the steps after a gate run on `!cancelled()`, so
    # one red gate does not hide the others' results.
    - name: Import every ciao module
      run: |
        set -o pipefail
        python - <<'EOF' | tee windows-imports.txt
        import importlib, pkgutil, traceback
        import ciao
        failed = 0
        names = sorted(m.name for m in pkgutil.walk_packages(ciao.__path__, "ciao."))
        for name in names:
            try:
                importlib.import_module(name)
            except BaseException as exc:  # noqa: BLE001 - report every failure
                failed += 1
                last = traceback.extract_tb(exc.__traceback__)[-1]
                print(f"FAIL {name}: {type(exc).__name__}: {exc} ({last.filename}:{last.lineno})")
        print(f"imported {len(names) - failed}/{len(names)} modules")
        raise SystemExit(1 if failed else 0)
        EOF
    - name: Python static type check (win32)
      if: ${{ !cancelled() }}
      run: |
        set -o pipefail
        python -m mypy ciao 2>&1 | tee windows-mypy.txt
    - name: Windows backend tests
      if: ${{ !cancelled() }}
      run: |
        set -o pipefail
        python -m pytest -n auto -q -rfE tests/ 2>&1 | tee windows-pytest.txt
    - name: Windows frontend tests
      if: ${{ !cancelled() }}
      working-directory: web
      env:
        NO_COLOR: '1'
      run: |
        set -o pipefail
        { npm ci && npm test; } 2>&1 | tee ../windows-vitest.txt
    # The install.ps1 steps below stay advisory: they record what the runner
    # did, and a hosted runner with no interactive logon is not a verdict on
    # the installer (see the end-to-end step).
    - name: Build install.ps1 offline fixture
      if: ${{ !cancelled() }}
      run: |
        python - <<'EOF' || true
        import pathlib, re, shutil, sys
        sys.path.insert(0, ".")
        from tests.test_engine_installer import VERSION, WHEEL_BYTES, WHEEL_NAME, _manifest_bytes
        from tests.test_release_manifest import _keypair, _sign
        out = pathlib.Path("ps1-fixture"); release = out / "release"
        release.mkdir(parents=True, exist_ok=True)
        raw = _manifest_bytes()
        private_key, public_key, key_id = _keypair()
        (release / "ciaobot-engine-manifest.json").write_bytes(raw)
        (release / "ciaobot-engine-manifest.json.sig").write_text(_sign(raw, private_key, key_id), encoding="utf-8")
        (release / WHEEL_NAME).write_bytes(WHEEL_BYTES)
        text = pathlib.Path("scripts/install.ps1").read_text(encoding="utf-8")
        text = re.sub(r"(\$ReleasePublicKey = ')[^']*(')", lambda m: m.group(1) + public_key + m.group(2), text)
        (out / "install.ps1").write_text(text, encoding="utf-8")
        print("fixture version", VERSION)
        EOF
    - name: Build install.ps1 end-to-end fixture
      if: ${{ !cancelled() }}
      run: |
        python - <<'EOF' || true
        # The offline fixture above is the bytes `the signed wheel`, which
        # `uv tool install` cannot install. This one is a real wheel built from
        # this checkout, so the advisory step below can run the installer all
        # the way through: tool, receipt, PATH, workspace, task, start, URL.
        import hashlib, json, pathlib, re, subprocess, sys
        sys.path.insert(0, ".")
        from ciao.release_manifest import build_manifest
        from tests.test_release_manifest import _keypair, _sign
        out = pathlib.Path("ps1-e2e"); release = out / "release"
        release.mkdir(parents=True, exist_ok=True)
        built = subprocess.run(
            [sys.executable, "-m", "pip", "wheel", ".", "--no-deps", "-w", str(release)],
            capture_output=True, text=True, check=False,
        )
        wheels = sorted(release.glob("*.whl"))
        if built.returncode != 0 or len(wheels) != 1:
            print("no buildable wheel:", built.stdout[-2000:], built.stderr[-2000:])
            raise SystemExit(0)
        wheel = wheels[0]
        # ciaobot-<version>-py3-none-any.whl -> <version>
        version = wheel.name.split("-")[1]
        payload = wheel.read_bytes()
        raw = json.dumps(build_manifest(version, [{
            "filename": wheel.name, "kind": "wheel", "platform": "any", "arch": "any",
            "sha256": hashlib.sha256(payload).hexdigest(), "size": len(payload),
        }], created="2026-10-01T00:00:00+00:00")).encode()
        private_key, public_key, key_id = _keypair()
        (release / "ciaobot-engine-manifest.json").write_bytes(raw)
        (release / "ciaobot-engine-manifest.json.sig").write_text(_sign(raw, private_key, key_id), encoding="utf-8")
        text = pathlib.Path("scripts/install.ps1").read_text(encoding="utf-8")
        text = re.sub(r"(\$ReleasePublicKey = ')[^']*(')", lambda m: m.group(1) + public_key + m.group(2), text)
        (out / "install.ps1").write_text(text, encoding="utf-8")
        print("e2e fixture", version, wheel.name)
        EOF
    - name: install.ps1 offline verification and analyzer (advisory)
      if: ${{ !cancelled() }}
      run: |
        python -m pip install uv || true
        {
          echo "--- pwsh, file form ---"
          pwsh -NoProfile -File ./ps1-fixture/install.ps1 -Version 1.2.3 -ReleaseDir ./ps1-fixture/release -DryRun
          echo "pwsh exit $?"
          echo "--- Windows PowerShell 5.1, file form ---"
          powershell -NoProfile -ExecutionPolicy Bypass -File ./ps1-fixture/install.ps1 -Version 1.2.3 -ReleaseDir ./ps1-fixture/release -DryRun
          echo "powershell exit $?"
          echo "--- Windows PowerShell 5.1, iex script-block form ---"
          powershell -NoProfile -Command "& ([scriptblock]::Create((Get-Content -Raw ./ps1-fixture/install.ps1))) -Version 1.2.3 -ReleaseDir ./ps1-fixture/release -DryRun"
          echo "powershell iex exit $?"
          echo "--- tampered manifest must be refused ---"
          sed -i 's/"1.2.3"/"9.9.9"/' ./ps1-fixture/release/ciaobot-engine-manifest.json
          pwsh -NoProfile -File ./ps1-fixture/install.ps1 -Version 1.2.3 -ReleaseDir ./ps1-fixture/release -DryRun
          echo "tampered exit $? (expected non-zero)"
          echo "--- PSScriptAnalyzer ---"
          pwsh -NoProfile -Command "if (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue) { Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error | Format-Table -AutoSize | Out-String -Width 200 } else { 'PSScriptAnalyzer not installed' }"
          echo "--- both hosts must parse the file ---"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./scripts/install.ps1)) | Out-Null; 'pwsh parse ok'"
          powershell -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./scripts/install.ps1)) | Out-Null; 'powershell parse ok'"
        } > windows-install-ps1.txt 2>&1 || true
    # Advisory by construction: an InteractiveToken task may not register or
    # start on a hosted runner with no interactive logon, and a "no" there is the
    # datum this step exists to produce, not a failure. Nothing below can fail
    # the job, and the workspace is a throwaway under RUNNER_TEMP.
    - name: install.ps1 end-to-end install and uninstall (advisory)
      if: ${{ !cancelled() }}
      # The step's shell is Git Bash, whose MSYS path conversion turns a
      # `/Query`, `/TN`, `/v` or `/End` argument into a Windows path before the
      # program ever sees it: `schtasks` and `reg` were being asked to read
      # paths, reported nothing, and every "no" below was the shell talking
      # rather than the installer. MSYS_NO_PATHCONV=1 turns that off for this
      # step; without it the probes test the shell, not the machine.
      env:
        MSYS_NO_PATHCONV: '1'
      run: |
        {
          # basename, not the whole path: `cut -d- -f2` on
          # `ps1-e2e/release/ciaobot-1.2.3-py3-none-any.whl` yields
          # `e2e/release/ciaobot`, which the installer refuses as an invalid
          # version - the run then "passes" having installed nothing.
          version=$(basename "$(ls ps1-e2e/release/*.whl 2>/dev/null | head -1)" | cut -d- -f2)
          if [ -z "$version" ]; then
            echo "no end-to-end wheel was built; skipping the run"
          else
            workspace="$RUNNER_TEMP/ps1-e2e-ws"
            python -m pip install uv >/dev/null 2>&1 || true
            bin_dir="$(uv tool dir --bin 2>/dev/null)"
            echo "--- install ---"
            # The one-time setup URL is a credential, and Q3 keeps it out of the
            # log. `::add-mask::` with no value masks the empty string and hides
            # nothing, and the token is only known after the installer prints it,
            # so the install output is redacted on its way into this file (which
            # is uploaded as an artifact) instead of masked afterwards.
            powershell -NoProfile -ExecutionPolicy Bypass -File ./ps1-e2e/install.ps1 -Version "$version" -ReleaseDir ps1-e2e/release -Workspace "$workspace" 2>&1 \
              | sed -E 's#(Open Ciaobot: ).*#\1[redacted]#'
            echo "install exit ${PIPESTATUS[0]}"
            # Four markers, one word each, so the Summarize step and a human
            # reading the artifact can tell an installer that ran from one that
            # refused before it started. "installed" is the engine's own entry
            # point on disk, which is the first thing a failed run does not leave.
            test -f "$bin_dir/ciao.exe" && echo "installed: yes" || echo "installed: no"
            schtasks /Query /TN '\Ciaobot\Engine' >/dev/null 2>&1 && echo "task existed after install: yes" || echo "task existed after install: no"
            port="$(awk -F= '/^PWA_PORT=/{gsub(/"/,"",$2); print $2}' "$workspace/.env" 2>/dev/null | tail -1)"
            [ -n "$port" ] || port=8443
            curl -fsS "http://localhost:$port/api/startup-status" >/dev/null 2>&1 && echo "engine reachable: yes" || echo "engine reachable: no"
            test -f "$USERPROFILE/.local/state/ciaobot/install-receipt.json" && echo "receipt present: yes" || echo "receipt present: no"
            reg query 'HKCU\Environment' /v Path 2>/dev/null | grep -qiF "$bin_dir" && echo "bin dir on user PATH: yes" || echo "bin dir on user PATH: no"
            echo "--- uninstall ---"
            powershell -NoProfile -ExecutionPolicy Bypass -File ./ps1-e2e/install.ps1 -Uninstall
            echo "uninstall exit $?"
            uv tool list 2>/dev/null | grep -qE '^[[:space:]]*-[[:space:]]+ciaobot([[:space:]]|$)' && echo "uninstalled: no (expected no)" || echo "uninstalled: yes (expected yes)"
            schtasks /Query /TN '\Ciaobot\Engine' >/dev/null 2>&1 && echo "task gone after uninstall: no (expected yes)" || echo "task gone after uninstall: yes (expected yes)"
            test -f "$USERPROFILE/.local/state/ciaobot/install-receipt.json" && echo "receipt present: yes (expected no)" || echo "receipt present: no (expected no)"
            test -d "$workspace" && echo "workspace kept: yes (expected yes)" || echo "workspace kept: no (expected yes)"
            echo "--- -NoStart registers nothing ---"
            powershell -NoProfile -ExecutionPolicy Bypass -File ./ps1-e2e/install.ps1 -Version "$version" -ReleaseDir ps1-e2e/release -Workspace "$RUNNER_TEMP/ps1-e2e-ws2" -NoStart
            echo "no-start exit $?"
            schtasks /Query /TN '\Ciaobot\Engine' >/dev/null 2>&1 && echo "task registered after -NoStart: yes (expected no)" || echo "task registered after -NoStart: no (expected no)"
            powershell -NoProfile -ExecutionPolicy Bypass -File ./ps1-e2e/install.ps1 -Uninstall
          fi
        } > windows-install-e2e.txt 2>&1 || true
    - name: Summarize
      if: always()
      run: |
        # `tests/` keeps captured log lines that also start with ERROR out.
        grep -E '^(FAILED|ERROR) tests/' windows-pytest.txt | sed -E 's/ - .*//' | sort -u > windows-failures.txt || true
        {
          echo "### Windows (#696)"
          echo
          echo "- imports: $(tail -1 windows-imports.txt 2>/dev/null)"
          echo "- mypy: $(tail -1 windows-mypy.txt 2>/dev/null)"
          echo "- pytest: $(tail -1 windows-pytest.txt 2>/dev/null)"
          echo "- npm test: $(grep -E '^ *(Test Files|Tests) ' windows-vitest.txt 2>/dev/null | tr -s ' ' | paste -sd ';' -)"
          echo "- install.ps1: $(grep -E 'exit ' windows-install-ps1.txt 2>/dev/null | paste -sd ';' -)"
          echo "- install.ps1 end-to-end: $(grep -oE '^(installed|task existed after install|uninstalled|task gone after uninstall): (yes|no)' windows-install-e2e.txt 2>/dev/null | paste -sd',' - | sed -E 's#,#, #g')"
          echo
          echo "Full logs and the failing-test list are in the \`windows-results\` artifact."
          if [ -s windows-failures.txt ]; then
            echo
            echo "Failing tests:"
            echo
            sed 's/^/- /' windows-failures.txt
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        # The gates above already fail the job; this names the tests that did.
        if [ -s windows-failures.txt ]; then
          echo "::error::$(wc -l < windows-failures.txt) Windows test(s) failed; see the job summary"
          exit 1
        fi
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-results
        path: windows-*.txt
        retention-days: 14
        if-no-files-found: ignore

  test:
    # Engine-only coverage that only the real platform can give: a develop PR
    # waits on `linux-server` alone, and this job runs on the post-merge push
    # to develop and on release cuts into main.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[test]'

    - name: Python static type check
      run: |
        mypy ciao

    - name: Python dependency security audit
      run: |
        pip-audit --desc || true

    - name: Run pytest with coverage
      run: |
        pytest -n auto --cov=ciao --cov-report=term-missing tests/

    - name: Install frontend dependencies
      run: |
        cd web
        npm ci

    - name: Frontend lint check
      run: |
        cd web
        npm run lint || true

    - name: Frontend dependency audit
      run: |
        cd web
        npm audit --audit-level=high || true

    - name: Run frontend tests
      run: |
        cd web
        npm run test

    - name: Build PWA
      run: |
        cd web
        npm run build

    # Browser regression suite. It lives inside this job rather than in one of
    # its own so it reuses the node_modules and the build that the two steps
    # above just produced; the only marginal cost is the Chromium download,
    # which the cache below removes on every run but the first for a given
    # Playwright version.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

    - name: Install Playwright Chromium
      working-directory: web
      run: npx playwright install chromium

    # Blocking, with no retries configured. A browser test that only passes on
    # the second attempt is a broken test, and hiding that behind a retry is
    # how a suite ends up being ignored. The suite is hermetic (a synthetic
    # Node backend, no Python, no credentials, no sleeps), so if it ever does
    # flake the answer is to delete the offending spec, not to soften the gate.
    - name: Run PWA browser tests
      working-directory: web
      run: npm run test:e2e

    - name: Upload browser test traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: web/test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    # The release ships the engine wheel and nothing else (#653), so the
    # macOS-only coverage is the engine too: build the wheel this branch would
    # publish, install it the way a user gets it, and start the service.
    - name: Build engine wheel
      run: uv build --wheel --out-dir dist

    - name: Cold-start the built engine and wait for it
      run: |
        engine_venv="$RUNNER_TEMP/engine"
        engine="$engine_venv/bin/ciao"
        uv venv --python 3.12 "$engine_venv"
        uv pip install --python "$engine_venv/bin/python" dist/ciaobot-*.whl
        test -x "$engine"
        mkdir -p "${RUNNER_TEMP}/ci-workspace"
        # `--load-launchd` and `--python` are what scripts/install-engine.sh
        # passes: the LaunchAgent has to name this venv's ciao, and launchd has
        # to drop any job definition it already holds before service start.
        "$engine" setup --workspace "${RUNNER_TEMP}/ci-workspace" --app-dir "${RUNNER_TEMP}/ci-apps" --python "$engine" --load-launchd
        "$engine" service start --workspace "${RUNNER_TEMP}/ci-workspace"
        port="$(awk -F= '/^PWA_PORT=/{print $2}' "${RUNNER_TEMP}/ci-workspace/.env" 2>/dev/null | tr -d '"' | tail -1)"
        [ -n "$port" ] || port=8443
        for _ in {1..45}; do
          curl -fsS "http://localhost:$port/api/startup-status" >/dev/null 2>&1 && break
          sleep 1
        done
        curl -fsS "http://localhost:$port/api/startup-status" >/dev/null

    - name: Cold-start diagnostics
      if: failure()
      run: |
        workspace="${RUNNER_TEMP}/ci-workspace"
        echo "--- processes ---"
        pgrep -lf 'ciao|uv' || echo "(none)"
        echo "--- listening TCP sockets ---"
        lsof -nP -iTCP -sTCP:LISTEN || true
        echo "--- launchd state ---"
        launchctl print "gui/$(id -u)/com.ciao.server" 2>&1 | head -30 || true
        echo "--- workspace .env ---"
        cat "${workspace}/.env" 2>/dev/null || echo "(absent)"
        for log in ciao.stderr.log ciao.stdout.log; do
          echo "--- ${log} ---"
          tail -60 "${workspace}/.runtime/${log}" 2>/dev/null || echo "(absent)"
        done

    - name: Stop the engine
      if: always()
      run: |
        ciao service stop --force >/dev/null 2>&1 || true

    - name: Smoke-test package
      run: |
        ciao package-smoke --skip-frontend
