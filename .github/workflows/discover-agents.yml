name: discover-agents

# Records where Claude Code and OpenCode really keep their files on macOS and
# Windows (#696, D-04, checkpoint C1). Observation only: it installs both
# tools, runs one tiny real turn each in workspaces whose paths contain a
# space, a dot and an underscore, and uploads every file the tools created.
# Manual and weekly; never on pull requests (provider quota, secrets).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  discover:
    name: discover (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ matrix.label }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install OpenCode 2.x
      run: |
        npm install -g @opencode/cli
        if [ "$RUNNER_OS" = "Windows" ]; then
          # npm's global bin dir is the prefix itself on Windows; make sure
          # later steps (new shells) see it.
          npm prefix -g | tr -d '\r' >> "$GITHUB_PATH"
        fi

    - name: Install Claude Code (macOS)
      if: runner.os == 'macOS'
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install Claude Code (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        irm https://claude.ai/install.ps1 | iex
        Add-Content -Path $env:GITHUB_PATH -Encoding utf8 -Value (Join-Path $env:USERPROFILE '.local\bin')

    - name: Record tool versions and locations
      run: |
        set +e
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        OUT="$T/agent-discovery"; mkdir -p "$OUT"
        {
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "HOME=$HOME"
          echo "USERPROFILE=${USERPROFILE:-}"
          echo "APPDATA=${APPDATA:-}"
          echo "LOCALAPPDATA=${LOCALAPPDATA:-}"
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-}"
          echo "XDG_DATA_HOME=${XDG_DATA_HOME:-}"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME:-}"
          echo "XDG_STATE_HOME=${XDG_STATE_HOME:-}"
          for t in claude opencode git node; do
            echo
            echo "=== $t"
            echo "command -v: $(command -v "$t" || echo '(not found)')"
            "$t" --version < /dev/null 2>&1 | head -3
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo
            echo "=== where.exe"
            where.exe claude opencode git node 2>&1
          fi
          echo
          echo "=== PATH"
          echo "$PATH" | tr ':' '\n'
        } > "$OUT/tools-$LABEL.txt" 2>&1
        cat "$OUT/tools-$LABEL.txt"
        # Both tools must exist or the rest is meaningless.
        command -v claude >/dev/null 2>&1 || { echo "::error::claude not on PATH"; exit 1; }
        command -v opencode >/dev/null 2>&1 || { echo "::error::opencode not on PATH"; exit 1; }

    - name: Create workspaces
      run: |
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        mkdir -p "$T/ws plain" "$T/a.b/c_d" "$T/Mixed-Case"
        printf '%s\n' "$T/ws plain" "$T/a.b/c_d" "$T/Mixed-Case" > "$T/workspaces.txt"
        cat "$T/workspaces.txt"

    - name: Run one tiny real turn per workspace
      timeout-minutes: 25
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        set +e
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        OUT="$T/agent-discovery"; mkdir -p "$OUT"
        TURNS="$OUT/turns-$LABEL.txt"
        CPROJ="$OUT/claude-projects-$LABEL.txt"
        CLAUDE_DIR="$HOME/.claude/projects"

        # run_timed SECONDS LOGFILE CMD... : stdin closed (opencode run hangs
        # with stdin open), stdout+stderr to LOGFILE, killed after SECONDS.
        # Exit status is the command's (143 when the timeout killed it).
        run_timed() {
          local secs="$1" log="$2"
          shift 2
          "$@" < /dev/null > "$log" 2>&1 &
          local pid=$!
          ( sleep "$secs"; kill "$pid" 2>/dev/null ) > /dev/null 2>&1 &
          local killer=$!
          local rc=0
          wait "$pid" || rc=$?
          kill "$killer" 2>/dev/null
          return "$rc"
        }

        # The marker is taken before any turn; the file dump lists what is newer.
        touch "$T/marker"
        sleep 2
        date -u +%Y-%m-%dT%H:%M:%SZ > "$OUT/marker-time-$LABEL.txt"

        printf '# provider\tworkspace\texit\treply_contains_OK\n' > "$TURNS"
        printf '# folder\tworkspace (pwd)\tworkspace (pwd -W, Windows only)\n' > "$CPROJ"

        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "::notice::ANTHROPIC_API_KEY is not set; skipping the Claude turns"
          printf 'claude\t-\tskipped\t-\n' >> "$TURNS"
          printf '# skipped: ANTHROPIC_API_KEY is not set\n' >> "$CPROJ"
        fi

        n=0
        while IFS= read -r ws; do
          n=$((n + 1))
          abs="$(cd "$ws" && pwd)"
          winabs="$(cd "$ws" && pwd -W 2>/dev/null || true)"

          log="$OUT/turn-opencode-$n-$LABEL.log"
          ( cd "$ws" && run_timed 240 "$log" opencode run -m opencode/big-pickle "Reply with exactly: OK" )
          rc=$?
          ok=no; grep -q 'OK' "$log" && ok=yes
          printf 'opencode\t%s\t%s\t%s\n' "$ws" "$rc" "$ok" >> "$TURNS"
          echo "opencode turn $n ($ws): exit $rc, OK=$ok"

          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            ls -1 "$CLAUDE_DIR" 2>/dev/null | sort > "$T/cp-before.txt"
            log="$OUT/turn-claude-$n-$LABEL.log"
            ( cd "$ws" && run_timed 240 "$log" claude -p "Reply with exactly: OK" --max-turns 1 )
            rc=$?
            ok=no; grep -q 'OK' "$log" && ok=yes
            printf 'claude\t%s\t%s\t%s\n' "$ws" "$rc" "$ok" >> "$TURNS"
            echo "claude turn $n ($ws): exit $rc, OK=$ok"
            ls -1 "$CLAUDE_DIR" 2>/dev/null | sort > "$T/cp-after.txt"
            comm -13 "$T/cp-before.txt" "$T/cp-after.txt" | while IFS= read -r folder; do
              printf '%s\t%s\t%s\n' "$folder" "$abs" "$winabs" >> "$CPROJ"
            done
          fi
        done < "$T/workspaces.txt"

        {
          echo "# all folders now under ~/.claude/projects:"
          ls -1 "$CLAUDE_DIR" 2>/dev/null | sed 's/^/# /'
        } >> "$CPROJ"

        # Each tool's own path report, if it has one. Output is informational.
        run_timed 60 "$OUT/opencode-paths-$LABEL.txt" opencode debug paths

        cat "$TURNS"

    - name: List files the tools created
      run: |
        set +e
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        OUT="$T/agent-discovery"; mkdir -p "$OUT"
        posix() { if command -v cygpath >/dev/null 2>&1; then cygpath -u "$1"; else printf '%s\n' "$1"; fi; }

        roots=("$HOME")
        if [ "$RUNNER_OS" = "Windows" ]; then
          for v in USERPROFILE APPDATA LOCALAPPDATA; do
            val="${!v}"
            [ -n "$val" ] && roots+=("$(posix "$val")")
          done
        fi
        # On macOS the runner's work tree lives under $HOME: skip it, it holds
        # the workspaces, the checkout and these output files.
        work_root="$(dirname "$T")"

        find "${roots[@]}" \
          \( -path "$work_root" -o -path "$T" \
             -o -name node_modules -o -name npm-cache -o -name _cacache -o -name _npx \
             -o -path '*/AppData/Local/Temp' -o -path '*/AppData/Local/Microsoft' \
             -o -path '*/AppData/Local/Packages' -o -path '*/AppData/Roaming/Microsoft' \) -prune \
          -o \( -type f -o -type l \) -newer "$T/marker" -print 2>/dev/null \
          | sort -u > "$OUT/discovery-$LABEL.txt"

        echo "files newer than the marker: $(wc -l < "$OUT/discovery-$LABEL.txt" | tr -d ' ')"
        head -200 "$OUT/discovery-$LABEL.txt"

    - name: Summarize
      if: always()
      run: |
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        OUT="$T/agent-discovery"
        {
          echo "### discover-agents ($LABEL)"
          echo
          echo '```'
          cat "$OUT/turns-$LABEL.txt" 2>/dev/null
          echo
          cat "$OUT/claude-projects-$LABEL.txt" 2>/dev/null
          echo '```'
          echo
          echo "Full dump in the \`agent-discovery-$LABEL\` artifact."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload discovery artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-discovery-${{ matrix.label }}
        path: ${{ runner.temp }}/agent-discovery
        retention-days: 30
        if-no-files-found: warn

    - name: Fail if a real turn failed
      run: |
        T="$RUNNER_TEMP"; if command -v cygpath >/dev/null 2>&1; then T="$(cygpath -u "$RUNNER_TEMP")"; fi
        bad="$(awk -F'\t' '!/^#/ && $3 != "0" && $3 != "skipped"' "$T/agent-discovery/turns-$LABEL.txt")"
        if [ -n "$bad" ]; then
          echo "::error::provider turns failed (see the artifact logs):"
          echo "$bad"
          exit 1
        fi
