name: Reviewed 3061 native baseline

# Proposed temporary location: .github/workflows/3061-baseline.yml
# A branch push works without adding a workflow to the default branch.
on:
  push:
    branches: [raffaelefarinaro/issue-3061-native-baseline]
    paths:
      - .github/workflows/3061-baseline.yml
      - scripts/probes/3061/**

permissions:
  contents: read
  actions: read # Server-side current-attempt runner provenance only.

concurrency:
  group: reviewed-3061-baseline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  baseline:
    name: baseline-${{ matrix.os }}
    # No forks, PR payloads, self-hosted runners, environments or secrets.
    if: github.repository == 'raffaelefarinaro/ciaobot'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      # Official v7 tag→commit mappings resolved read-only during proposal.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 448ca028e7c9ba836980343e7a86c7eaddd8828a
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: probe-python
        with:
          python-version: '3.12'
      - name: Verify current job runner using GitHub API
        shell: pwsh
        env:
          GH_PROVENANCE_TOKEN: ${{ github.token }}
          PROBE_RUN: ${{ github.run_id }}
          PROBE_ATTEMPT: ${{ github.run_attempt }}
          PROBE_JOB_NAME: baseline-${{ matrix.os }}
          PROBE_IMAGE: ${{ matrix.os }}
          PROBE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            if ($env:PROBE_RUNNER_ENVIRONMENT -ne "github-hosted") { throw "runner" }
            $uri = "https://api.github.com/repos/raffaelefarinaro/ciaobot/actions/runs/$($env:PROBE_RUN)/attempts/$($env:PROBE_ATTEMPT)/jobs?per_page=100"
            $headers = @{
              Authorization = "Bearer $($env:GH_PROVENANCE_TOKEN)"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $response = Invoke-RestMethod -Uri $uri -Headers $headers
            if ($response.total_count -gt 100) { throw "pagination" }
            $jobs = @($response.jobs | Where-Object { $_.name -eq $env:PROBE_JOB_NAME })
            if ($jobs.Count -ne 1) { throw "job" }
            $job = $jobs[0]
            if ($job.run_id -ne [long]$env:PROBE_RUN -or $job.status -ne "in_progress") { throw "run" }
            if ($job.runner_group_name -ne "GitHub Actions" -or $job.runner_name -notlike "GitHub Actions*") { throw "group" }
            if ($job.labels -notcontains $env:PROBE_IMAGE) { throw "image" }
            Write-Output ('{"event":"server-runner-provenance","job_id":' + $job.id + ',"verified":true}')
          } catch {
            Write-Output '{"event":"BLOCKED","reason":"server-runner-provenance-unverified-redacted"}'
            exit 1
          }
      - name: Externally sanitized native baseline
        shell: pwsh
        env:
          PROBE_SETUP_PYTHON: ${{ steps.probe-python.outputs.python-path }}
          PROBE_TEMP_ROOT: ${{ runner.temp }}
          PROBE_HOSTED_RUNNER: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            # Match the pinned setup-python find-python.ts executable layout.
            # Never pick a PATH result or run an unsanitized validation interpreter.
            if ([string]::IsNullOrWhiteSpace($env:pythonLocation) -or
                -not [IO.Path]::IsPathFullyQualified($env:pythonLocation) -or
                -not (Test-Path -LiteralPath $env:pythonLocation -PathType Container)) { throw "location" }
            if ($IsWindows) {
              $pythonExe = Join-Path $env:pythonLocation "python.exe"
              $comparison = [StringComparison]::OrdinalIgnoreCase
            } elseif ($IsLinux -or $IsMacOS) {
              $pythonExe = Join-Path (Join-Path $env:pythonLocation "bin") "python"
              $comparison = [StringComparison]::Ordinal
            } else { throw "platform" }
            if ([string]::IsNullOrWhiteSpace($env:PROBE_SETUP_PYTHON) -or
                -not [IO.Path]::IsPathFullyQualified($env:PROBE_SETUP_PYTHON)) { throw "output" }
            $pythonExe = [IO.Path]::GetFullPath($pythonExe)
            if (-not [string]::Equals($pythonExe, [IO.Path]::GetFullPath($env:PROBE_SETUP_PYTHON), $comparison) -or
                -not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw "executable" }
            # Scalar absolute path; launcher still sanitizes env before -I -S -B.
            & ./harness/scripts/probes/3061/launch.ps1 `
              -Python ([string]$pythonExe) `
              -Repository baseline `
              -TempRoot $env:PROBE_TEMP_ROOT `
              -HostedRunner $env:PROBE_HOSTED_RUNNER
            exit $LASTEXITCODE
          } catch {
            Write-Output '{"event":"BLOCKED","reason":"setup-python-executable-unverified-redacted"}'
            exit 1
          }
