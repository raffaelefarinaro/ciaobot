name: release smoke

on:
  workflow_call:
    inputs:
      version:
        description: "Released version to install and smoke test."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to install and smoke test (e.g. 0.8.1)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - name: Normalize version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install with the one-line installer
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          curl -fsSL "https://github.com/raffaelefarinaro/ciaobot/releases/download/v${VERSION}/install.sh" \
            | sh -s -- --version "$VERSION"
          app="$HOME/Applications/Ciaobot.app"
          test -x "$app/Contents/MacOS/ciaobot-desktop"
          test -x "$app/Contents/Resources/ciao-runtime/bin/ciao"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$HOME/Library/LaunchAgents/Ciaobot.plist")" = "$app/Contents/MacOS/ciaobot-desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$HOME/Library/LaunchAgents/Ciaobot.plist")" = "--background"
          launchctl print "gui/$(id -u)/Ciaobot" >/dev/null
          ! xattr -p com.apple.quarantine "$app" 2>/dev/null
      - name: Launch and wait for the engine
        run: |
          set -euo pipefail
          app="$HOME/Applications/Ciaobot.app"
          open -g "$app" --args --background >"$RUNNER_TEMP/ciaobot-open.log" 2>&1 &
          for _ in {1..30}; do
            pgrep -x ciaobot-desktop >/dev/null && break
            sleep 1
          done
          pgrep -x ciaobot-desktop >/dev/null
          for _ in {1..45}; do
            curl -fsS http://localhost:8443/api/startup-status >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8443/api/startup-status | jq -e '.desktop_api_version == 1'
      - name: Re-run installer as an update/recovery path
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          curl -fsSL "https://github.com/raffaelefarinaro/ciaobot/releases/download/v${VERSION}/install.sh" \
            | sh -s -- --version "$VERSION" --no-start
          test -x "$HOME/Applications/Ciaobot.app/Contents/Resources/ciao-runtime/bin/ciao"
      - name: Verify updater metadata and installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          gh release download "v${VERSION}" --repo raffaelefarinaro/ciaobot --pattern latest.json --pattern install.sh --pattern ciaobot-installer-verify_aarch64
          jq -e '.platforms["darwin-aarch64"].url and .platforms["darwin-aarch64"].signature' latest.json
          if grep -q '__VERIFIER_SHA256__' install.sh; then
            echo "release installer still contains its checksum placeholder" >&2
            exit 1
          fi
          # Not `test -x`: a GitHub release asset does not carry a mode, so it
          # always downloads 0644 no matter what the upload chmod'd it to, and
          # that assertion could never pass. install.sh chmods the verifier
          # itself before running it. What is worth asserting is that the asset
          # is the aarch64 binary the installer expects to be able to run.
          test -s ciaobot-installer-verify_aarch64
          chmod 755 ciaobot-installer-verify_aarch64
          file ciaobot-installer-verify_aarch64 | grep -qi "arm64"
          ./ciaobot-installer-verify_aarch64 2>&1 | grep -q "usage:"
      - name: Diagnostics
        if: failure()
        run: |
          echo "--- processes ---"
          pgrep -lf 'ciaobot|ciao' || true
          echo "--- launchd state ---"
          launchctl print "gui/$(id -u)/com.ciao.server" 2>&1 | head -60 || true
          echo "--- LaunchAgent ---"
          cat "$HOME/Library/LaunchAgents/com.ciao.server.plist" 2>/dev/null || true
          echo "--- runtime logs ---"
          find "$HOME/Ciaobot/.runtime" -maxdepth 1 -type f -print -exec tail -80 {} \; 2>/dev/null || true
          echo "--- app launch log ---"
          cat "$RUNNER_TEMP/ciaobot-open.log" 2>/dev/null || true
