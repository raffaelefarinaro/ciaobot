name: release smoke

on:
  workflow_call:
    inputs:
      version:
        description: "Released version to install and smoke test."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to install and smoke test (e.g. 2.0.0)."
        required: true
        type: string

env:
  # The one release whose 1.x engine manifest is published (#3131 Q3). Same
  # value as publish.yml. The legacy-update job runs for this version only.
  LEGACY_MANIFEST_VERSION: "2.0.0"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      legacy: ${{ steps.resolve.outputs.legacy }}
    steps:
      - name: Normalize version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED#v}"
          case "$version" in
            ''|*[!0-9.]*)
              echo "not a release version: '$REQUESTED'" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          legacy=false
          if [ "$version" = "$LEGACY_MANIFEST_VERSION" ]; then
            legacy=true
          fi
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"

  linux-install:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Install with the one-line installer
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The runner user has passwordless sudo, which ciao service install
          # uses to write the unit. The workspace is explicit so the checks
          # below read the same .env the service runs from.
          workspace="$RUNNER_TEMP/ciaobot-smoke-ws"
          echo "SMOKE_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          install_log="$RUNNER_TEMP/linux-install.log"
          # The login URL ciao setup prints is a credential: it is redacted
          # before anything reaches the job log.
          show_log() {
            sed -E -e 's#(Open Ciaobot: ).*#\1[redacted]#' \
              -e 's#https?://[^[:space:]]*(token|setup)[^[:space:]]*#[redacted]#g' "$install_log" || true
          }
          if ! { curl -fsSL --max-time 600 "https://github.com/raffaelefarinaro/ciaobot/releases/download/v${VERSION}/install.sh" \
            | sh -s -- --workspace "$workspace"; } > "$install_log" 2>&1; then
            show_log
            echo "the one-line installer failed" >&2
            exit 1
          fi
          show_log
          test -x "$HOME/.local/bin/ciao"
          [ "$("$HOME/.local/bin/ciao" --version)" = "ciao $VERSION" ]
      - name: Check the service answers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The port comes from the workspace the installer set up, and falls
          # back to the default the engine uses when .env does not name one.
          port=$(awk -F= '/^PWA_PORT=/{print $2}' "$SMOKE_WORKSPACE/.env" 2>/dev/null | tr -d '"' | tail -1 || true)
          [ -n "$port" ] || port=8443
          for _ in $(seq 1 90); do
            systemctl is-active --quiet ciaobot && break
            sleep 1
          done
          systemctl is-active --quiet ciaobot
          for _ in $(seq 1 90); do
            curl -fsS --max-time 5 "http://127.0.0.1:$port/api/startup-status" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 "http://127.0.0.1:$port/api/startup-status" | jq -e '.desktop_api_version == 1'
      - name: Re-run the one-liner as the update path
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # No flags, as a user pasting the one-liner again would run it. The
          # installed unit keeps the workspace it records.
          update_log="$RUNNER_TEMP/linux-update.log"
          if ! { curl -fsSL --max-time 600 "https://github.com/raffaelefarinaro/ciaobot/releases/download/v${VERSION}/install.sh" \
            | sh; } > "$update_log" 2>&1; then
            sed -E -e 's#(Open Ciaobot: ).*#\1[redacted]#' \
              -e 's#https?://[^[:space:]]*(token|setup)[^[:space:]]*#[redacted]#g' "$update_log" || true
            echo "the update run of the one-line installer failed" >&2
            exit 1
          fi
          test -x "$HOME/.local/bin/ciao"
          [ "$("$HOME/.local/bin/ciao" --version)" = "ciao $VERSION" ]
          port=$(awk -F= '/^PWA_PORT=/{print $2}' "$SMOKE_WORKSPACE/.env" 2>/dev/null | tr -d '"' | tail -1 || true)
          [ -n "$port" ] || port=8443
          for _ in $(seq 1 90); do
            systemctl is-active --quiet ciaobot && break
            sleep 1
          done
          systemctl is-active --quiet ciaobot
          for _ in $(seq 1 90); do
            curl -fsS --max-time 5 "http://127.0.0.1:$port/api/startup-status" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 "http://127.0.0.1:$port/api/startup-status" | jq -e '.desktop_api_version == 1'
      - name: Diagnostics
        if: failure()
        run: |
          redact() {
            sed -E -e 's#(Open Ciaobot: ).*#\1[redacted]#' \
              -e 's#https?://[^[:space:]]*(token|setup)[^[:space:]]*#[redacted]#g'
          }
          echo "--- install log ---"
          redact < "$RUNNER_TEMP/linux-install.log" 2>/dev/null | tail -200 || true
          echo "--- update log ---"
          redact < "$RUNNER_TEMP/linux-update.log" 2>/dev/null | tail -200 || true
          echo "--- service ---"
          systemctl status ciaobot --no-pager 2>&1 | head -60 || true
          echo "--- journal ---"
          sudo -n journalctl -u ciaobot -n 200 --no-pager 2>&1 | redact || true
          echo "--- runtime logs ---"
          find "${SMOKE_WORKSPACE:-$HOME/Ciaobot}/.runtime" -maxdepth 1 -type f \
            -exec sh -c 'echo "== $1"; tail -80 "$1" | sed -E -e "s#(Open Ciaobot: ).*#\1[redacted]#"' _ {} \; 2>/dev/null || true

  legacy-update:
    needs: resolve
    if: needs.resolve.outputs.legacy == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.resolve.outputs.version }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Stage the release from the 1.x updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The gate fetches the pinned 1.x wheel and the published manifest,
          # signature and wheel, then runs that 1.x updater to stage the
          # release. It never applies the update.
          python3 scripts/legacy-update-gate.py \
            --target "$VERSION" \
            --release-base https://github.com/raffaelefarinaro/ciaobot/releases/download \
            --uv "$(command -v uv)"
