name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: macos-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Build PWA assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build engine wheel
        run: uv build --wheel --out-dir dist
      - name: Verify engine wheel in a clean environment
        run: |
          set -euo pipefail
          uv venv --python 3.13 "$RUNNER_TEMP/engine-check"
          uv pip install --python "$RUNNER_TEMP/engine-check/bin/python" dist/ciaobot-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/engine-check/bin/python" -m ciao.release_manifest check-static
      - name: Build universal server host
        # The release ships the engine UI plus one small prebuilt native macOS
        # host that carries the permission identity; it is not the retired
        # desktop app. The builder compiles both architectures, ad-hoc signs,
        # archives and re-extracts to verify the signature before any manifest
        # mentions it. The archive lands outside the repo and is the one asset
        # this workflow adds over the wheel-only release.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/engine-check/bin/python" scripts/build-server-host.py \
            --output "$RUNNER_TEMP/server-host-build"
      - name: Prepare release assets
        run: |
          set -euo pipefail
          # install.sh is the engine installer, and the public install command
          # keeps that name (#651): every README, site page and stale external
          # link already points at it, so a new user gets the engine without any
          # link having to change, and nobody can install the app a second time.
          # install-engine.sh is the same file under a second name, because the
          # already-merged transition app (#604) fetches that exact asset for its
          # Move action. That asset is scripts/install-engine.sh itself, uploaded
          # verbatim below, so the two names are the same bytes.
          cp scripts/install-engine.sh install.sh
          chmod 755 install.sh
      - name: Write and sign engine manifest
        env:
          VERSION: ${{ github.event.release.tag_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          py="$RUNNER_TEMP/engine-check/bin/python"
          ws="$GITHUB_WORKSPACE"
          host_archive="$RUNNER_TEMP/server-host-build/ciaobot-server-host-macos-universal-v1.tar.gz"
          (cd "$RUNNER_TEMP" && "$py" -m ciao.release_manifest build --version "$version" --out "$ws/ciaobot-engine-manifest.json" --server-host "$host_archive" "$ws"/dist/ciaobot-*.whl)
          # The manifest is signed by the same minisign key the installer
          # embeds, but the signer must not live under desktop/ any more or
          # #579b would break the release. `signer sign <path>` needs no Tauri
          # project, so @tauri-apps/cli runs standalone at the version
          # desktop/package.json pinned, and writes the same base64 minisign .sig
          # ciao.release_manifest already verifies - the step below is the gate.
          (cd "$ws" && npx --yes @tauri-apps/cli@2.11.4 signer sign ciaobot-engine-manifest.json)
          (cd "$RUNNER_TEMP" && "$py" -m ciao.release_manifest verify "$ws/ciaobot-engine-manifest.json" "$ws/ciaobot-engine-manifest.json.sig")
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Exactly seven engine assets: the macOS installer under both names,
          # the Windows installer, the wheel, the signed manifest beside it, and
          # the universal server host archive the manifest authenticates (#1022).
          # Still no app archive, no latest.json feed, no verifier and no
          # bundled runtime (#653).
          host_archive="$RUNNER_TEMP/server-host-build/ciaobot-server-host-macos-universal-v1.tar.gz"
          gh release upload "$TAG" \
            install.sh \
            scripts/install-engine.sh \
            scripts/install.ps1 \
            dist/ciaobot-*.whl \
            ciaobot-engine-manifest.json \
            ciaobot-engine-manifest.json.sig \
            "$host_archive" \
            --clobber
          # The transition release hands the engine over by downloading
          # install-engine.sh at its own tag (#604), a first-time macOS user
          # runs install.sh, and a Windows user runs install.ps1; every name
          # has to be on the release or a documented install path is dead.
          # Checked here, where the tag is still known.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets" | grep -qx install.sh
          printf '%s\n' "$assets" | grep -qx install-engine.sh
          printf '%s\n' "$assets" | grep -qx install.ps1
          printf '%s\n' "$assets" | grep -qx ciaobot-server-host-macos-universal-v1.tar.gz

  release-smoke:
    needs: build-engine
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-smoke.yml
    permissions:
      contents: read
    with:
      version: ${{ github.event.release.tag_name }}
