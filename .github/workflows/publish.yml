name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: macos-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          test -n "$newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swiftc --version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build PWA assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Resolve pinned Python runtimes
        id: python-runtime
        shell: bash
        run: |
          set -euo pipefail
          . scripts/pinned-python-runtime.env
          {
            echo "arm64_url=$CIAO_PYTHON_ARM64_URL"
            echo "arm64_sha256=$CIAO_PYTHON_ARM64_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Build embedded Ciaobot runtime
        env:
          CIAO_PYTHON_ARM64_URL: ${{ steps.python-runtime.outputs.arm64_url }}
          CIAO_PYTHON_ARM64_SHA256: ${{ steps.python-runtime.outputs.arm64_sha256 }}
        run: ./scripts/build-bundled-runtime.sh desktop/runtime
      - name: Build signed aarch64 desktop app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin
      - name: Build aarch64 installer verifier
        working-directory: desktop/installer-verify
        run: |
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/ciaobot-installer-verify \
            target/ciaobot-installer-verify_aarch64
      - name: Prepare release assets
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          bundle="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          updater="$(find "$bundle" -name '*.app.tar.gz' -type f -print -quit)"
          signature="${updater}.sig"
          verifier="desktop/installer-verify/target/ciaobot-installer-verify_aarch64"
          test -n "$updater" -a -f "$signature" -a -x "$verifier"
          updater_name="Ciaobot_${version}_aarch64.app.tar.gz"
          verifier_name="ciaobot-installer-verify_aarch64"
          cp "$updater" "$updater_name"
          cp "$signature" "${updater_name}.sig"
          cp "$verifier" "$verifier_name"
          chmod 755 "$verifier_name"
          verifier_sha256="$(shasum -a 256 "$verifier_name" | awk '{print $1}')"
          sed "s/__VERIFIER_SHA256__/${verifier_sha256}/g" scripts/install.sh > install.sh
          chmod 755 install.sh
          signature_value="$(cat "${updater_name}.sig")"
          download="https://github.com/raffaelefarinaro/ciaobot/releases/download/v${version}/${updater_name}"
          jq -n \
            --arg version "$version" \
            --arg notes "Ciaobot v${version}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "$download" \
            --arg signature "$signature_value" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}, "darwin-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            install.sh \
            ciaobot-installer-verify_aarch64 \
            Ciaobot_*_aarch64.app.tar.gz \
            Ciaobot_*_aarch64.app.tar.gz.sig \
            latest.json \
            --clobber

  release-smoke:
    needs: build-desktop
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.event.release.tag_name }}
