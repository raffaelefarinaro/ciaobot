name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: macos-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          test -n "$newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swiftc --version
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build PWA assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Resolve pinned Python runtimes
        id: python-runtime
        shell: bash
        run: |
          set -euo pipefail
          # Bump deliberately when refreshing the embedded runtime; the URLs
          # and hashes below are resolved from this immutable upstream tag.
          release_tag="20260807"
          metadata="$(curl -fsSL "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/${release_tag}")"
          resolve_asset() {
            local platform="$1"
            local asset url digest
            asset="$(jq -r --arg platform "$platform" '[.assets[] | select(.name | startswith("cpython-3.12.")) | select(.name | endswith($platform + "-install_only_stripped.tar.gz"))] | max_by(.name) | .name' <<<"$metadata")"
            test -n "$asset" -a "$asset" != "null"
            url="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' <<<"$metadata")"
            digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // ""' <<<"$metadata")"
            if [[ "$digest" == sha256:* ]]; then
              digest="${digest#sha256:}"
            else
              echo "No upstream digest for $asset; computing one from the pinned URL" >&2
              digest="$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')"
            fi
            printf '%s\n%s\n' "$url" "$digest"
          }
          arm64_result="$(resolve_asset aarch64-apple-darwin)"
          x86_64_result="$(resolve_asset x86_64-apple-darwin)"
          {
            echo "release_tag=$release_tag"
            echo "arm64_url=$(printf '%s\n' "$arm64_result" | sed -n '1p')"
            echo "arm64_sha256=$(printf '%s\n' "$arm64_result" | sed -n '2p')"
            echo "x86_64_url=$(printf '%s\n' "$x86_64_result" | sed -n '1p')"
            echo "x86_64_sha256=$(printf '%s\n' "$x86_64_result" | sed -n '2p')"
          } >> "$GITHUB_OUTPUT"
      - name: Build embedded Ciaobot runtime
        env:
          CIAO_PYTHON_ARM64_URL: ${{ steps.python-runtime.outputs.arm64_url }}
          CIAO_PYTHON_ARM64_SHA256: ${{ steps.python-runtime.outputs.arm64_sha256 }}
          CIAO_PYTHON_X86_64_URL: ${{ steps.python-runtime.outputs.x86_64_url }}
          CIAO_PYTHON_X86_64_SHA256: ${{ steps.python-runtime.outputs.x86_64_sha256 }}
        run: ./scripts/build-bundled-runtime.sh desktop/runtime
      - name: Build signed universal desktop app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin
      - name: Build universal installer verifier
        working-directory: desktop/installer-verify
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/ciaobot-installer-verify \
            target/x86_64-apple-darwin/release/ciaobot-installer-verify \
            -output target/ciaobot-installer-verify_universal
      - name: Prepare release assets
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          bundle="desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          updater="$(find "$bundle" -name '*.app.tar.gz' -type f -print -quit)"
          signature="${updater}.sig"
          verifier="desktop/installer-verify/target/ciaobot-installer-verify_universal"
          test -n "$updater" -a -f "$signature" -a -x "$verifier"
          updater_name="Ciaobot_${version}_universal.app.tar.gz"
          verifier_name="ciaobot-installer-verify_universal"
          cp "$updater" "$updater_name"
          cp "$signature" "${updater_name}.sig"
          cp "$verifier" "$verifier_name"
          chmod 755 "$verifier_name"
          verifier_sha256="$(shasum -a 256 "$verifier_name" | awk '{print $1}')"
          sed "s/__VERIFIER_SHA256__/${verifier_sha256}/g" scripts/install.sh > install.sh
          chmod 755 install.sh
          signature_value="$(cat "${updater_name}.sig")"
          download="https://github.com/raffaelefarinaro/ciaobot/releases/download/v${version}/${updater_name}"
          jq -n \
            --arg version "$version" \
            --arg notes "Ciaobot v${version}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "$download" \
            --arg signature "$signature_value" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}, "darwin-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            install.sh \
            ciaobot-installer-verify_universal \
            Ciaobot_*_universal.app.tar.gz \
            Ciaobot_*_universal.app.tar.gz.sig \
            latest.json \
            --clobber

  release-smoke:
    needs: build-desktop
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.event.release.tag_name }}
