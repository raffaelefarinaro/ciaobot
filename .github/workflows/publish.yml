name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # upload artifacts to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  build-desktop:
    runs-on: macos-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # Developer ID signing and notarization are opt-in on the secrets being
      # present. Without them the build stays ad-hoc signed exactly as before,
      # and users must approve the app in System Settings on first launch —
      # `brew install --cask` sets com.apple.quarantine, and a quarantined
      # non-notarized app cannot launch unattended at all. Notarization requires
      # signing with a Developer ID certificate at build time; an ad-hoc bundle
      # is rejected by notarytool, so this cannot be bolted on afterwards.
      #
      # To enable, set all of:
      #   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  password for that .p12
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID                    Apple ID email
      #   APPLE_PASSWORD              app-specific password for that Apple ID
      #   APPLE_TEAM_ID               10-character team id
      - name: Detect Developer ID credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID credentials; building ad-hoc signed and un-notarized. First launch will require manual approval in System Settings."
          fi

      - name: Build signed and notarized universal desktop artifacts
        if: steps.signing.outputs.enabled == 'true'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build ad-hoc signed universal desktop artifacts
        if: steps.signing.outputs.enabled != 'true'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      # Records what actually shipped, so "is this build notarized?" is answered
      # by the release log instead of by downloading the DMG and checking.
      - name: Report signing and notarization state
        run: |
          bundle="desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          app="$(find "$bundle" -maxdepth 3 -name '*.app' -type d -print -quit)"
          test -n "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | head -20 || true
          if spctl -a -vv -t exec "$app" 2>&1 | grep -q "source=Notarized"; then
            echo "notarized: yes"
          else
            echo "notarized: no"
            spctl -a -vv -t exec "$app" 2>&1 | head -10 || true
          fi
      - name: Prepare updater manifest
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          version="${VERSION#v}"
          bundle="desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          updater="$(find "$bundle" -name '*.app.tar.gz' -type f -print -quit)"
          signature="${updater}.sig"
          dmg="$(find "$bundle" -name '*.dmg' -type f -print -quit)"
          test -n "$updater" -a -f "$signature" -a -n "$dmg"
          updater_name="Ciaobot_${version}_universal.app.tar.gz"
          dmg_name="Ciaobot_${version}_universal.dmg"
          cp "$updater" "$updater_name"
          cp "$signature" "${updater_name}.sig"
          cp "$dmg" "$dmg_name"
          signature_value="$(cat "${updater_name}.sig")"
          download="https://github.com/raffaelefarinaro/ciaobot/releases/download/v${version}/${updater_name}"
          jq -n \
            --arg version "$version" \
            --arg notes "Ciaobot v${version}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "$download" \
            --arg signature "$signature_value" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $signature, url: $url},
                "darwin-x86_64": {signature: $signature, url: $url}
              }
            }' > latest.json
      - name: Attach desktop artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" Ciaobot_*_universal.dmg Ciaobot_*_universal.app.tar.gz Ciaobot_*_universal.app.tar.gz.sig latest.json --clobber

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: [build-and-publish, build-desktop]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Compute wheel checksum
        id: wheel
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          version="${VERSION#v}"
          wheel_url="https://github.com/raffaelefarinaro/ciaobot/releases/download/v${version}/ciaobot-${version}-py3-none-any.whl"
          sha256="$(curl -fsSL "$wheel_url" | sha256sum | awk '{print $1}')"
          dmg_url="https://github.com/raffaelefarinaro/ciaobot/releases/download/v${version}/Ciaobot_${version}_universal.dmg"
          dmg_sha256="$(curl -fsSL "$dmg_url" | sha256sum | awk '{print $1}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=${dmg_sha256}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: raffaelefarinaro/homebrew-ciaobot
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-ciaobot
      - name: Update formula
        run: |
          ./scripts/update-homebrew-tap.sh \
            "${{ steps.wheel.outputs.version }}" \
            "${{ steps.wheel.outputs.sha256 }}" \
            "${{ steps.wheel.outputs.dmg_sha256 }}" \
            homebrew-ciaobot
      - name: Commit and push tap update
        working-directory: homebrew-ciaobot
        env:
          RELEASE_VERSION: ${{ steps.wheel.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ciaobot.rb Casks/ciaobot-desktop.rb
          git commit -m "ciaobot ${RELEASE_VERSION}"
          git push

  # Lives in its own workflow so it can also be dispatched by hand against an
  # already-published version, instead of only ever running once per release.
  release-smoke:
    needs: update-homebrew-tap
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.event.release.tag_name }}
